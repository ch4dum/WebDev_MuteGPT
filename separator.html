<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MuteGPT — โลโก้หน้าจอเริ่มต้น" />
  <title>MuteGPT - โลโก้</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    .splash-main {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .splash-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    @media (min-width: 768px) {
      .splash-container {
        gap: 1.5rem;
      }
    }

    .splash-orbit {
      color: #fbbf24;
      width: 4rem;
      height: 4rem;
      filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.5));
    }

    @media (min-width: 768px) {
      .splash-orbit {
        width: 6rem;
        height: 6rem;
      }
    }

    .splash-orbit svg {
      width: 100%;
      height: 100%;
      animation: logo-spin 10s linear infinite;
    }

    .splash-title {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      filter: drop-shadow(0 0 25px rgba(251, 191, 36, 0.5));
      background: linear-gradient(to right, #fde68a, #facc15, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    @media (min-width: 768px) {
      .splash-title {
        font-size: 4.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- ===== BACKGROUND LAYER ===== -->
  <div class="bg-layer">
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>

    <!-- Zodiac Wheel -->
    <div class="zodiac-wheel">
      <svg viewBox="0 0 100 100" style="width:100%;height:100%;color:#fde68a;">
        <circle cx="50" cy="50" r="49" fill="none" stroke="currentColor" stroke-width="0.2" stroke-dasharray="1,1"/>
        <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="0.1"/>
        <circle cx="50" cy="50" r="35" fill="none" stroke="currentColor" stroke-width="0.2"/>
        <circle cx="50" cy="50" r="32" fill="none" stroke="currentColor" stroke-width="0.5" stroke-dasharray="2,4"/>
        <circle cx="50" cy="50" r="15" fill="none" stroke="currentColor" stroke-width="0.1"/>
        <circle cx="50" cy="50" r="5" fill="none" stroke="currentColor" stroke-width="0.3"/>
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(0 50 50)"/>
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(30 50 50)"/>
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(60 50 50)"/>
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(90 50 50)"/>
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(120 50 50)"/>
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(150 50 50)"/>
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(180 50 50)"/>
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(210 50 50)"/>
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(240 50 50)"/>
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(270 50 50)"/>
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(300 50 50)"/>
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(330 50 50)"/>
        <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5,0.5" transform="rotate(0 50 50)"/>
        <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5,0.5" transform="rotate(45 50 50)"/>
        <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5,0.5" transform="rotate(90 50 50)"/>
        <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5,0.5" transform="rotate(135 50 50)"/>
        <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5,0.5" transform="rotate(180 50 50)"/>
        <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5,0.5" transform="rotate(225 50 50)"/>
        <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5,0.5" transform="rotate(270 50 50)"/>
        <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5,0.5" transform="rotate(315 50 50)"/>
      </svg>
    </div>

    <div class="stars-small"></div>
    <div class="stars-medium"></div>
    <div class="stars-large"></div>
  </div>

  <!-- ===== MAIN CONTENT: Logo & MuteGPT Text ===== -->
  <main class="splash-main">
    <div class="splash-container">
      <div class="splash-orbit">
        <i data-lucide="orbit"></i>
      </div>
      <h1 class="splash-title">MuteGPT</h1>
    </div>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
