<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuteGPT - โลโก้</title>
    <!-- นำเข้า Tailwind CSS ผ่าน CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- นำเข้าไลบรารีไอคอน Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* สร้าง Animation สำหรับวงล้อดวงดาวให้หมุนช้าๆ โดยรักษาตำแหน่งกึ่งกลางไว้ */
        @keyframes spin-slow {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 180s linear infinite;
        }
        
        /* สร้าง Animation สำหรับไอคอนวงโคจรให้หมุน */
        @keyframes spin-normal {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-10s {
            animation: spin-normal 10s linear infinite;
        }
    </style>
</head>
<body class="min-h-screen bg-[#03030a] text-slate-200 font-sans selection:bg-purple-500/30 overflow-hidden relative">

    <!-- --- ASTROLOGY & STARS BACKGROUND (ธีมเดิม) --- -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <!-- Deep Space Nebula Glow -->
        <div class="absolute top-[-20%] left-[-10%] w-[70%] h-[70%] bg-purple-900/20 rounded-full blur-[150px] mix-blend-screen"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] bg-indigo-900/20 rounded-full blur-[120px] mix-blend-screen"></div>
        <div class="absolute top-[20%] left-[50%] translate-x-[-50%] w-[80%] h-[50%] bg-amber-600/5 rounded-full blur-[180px] mix-blend-screen"></div>

        <!-- Giant Spinning Zodiac/Astrology Wheel -->
        <div class="absolute top-1/2 left-1/2 animate-spin-slow w-[800px] h-[800px] md:w-[1200px] md:h-[1200px] opacity-[0.04] pointer-events-none">
            <svg viewBox="0 0 100 100" class="w-full h-full text-amber-200">
                <!-- Outer Ring -->
                <circle cx="50" cy="50" r="49" fill="none" stroke="currentColor" stroke-width="0.2" stroke-dasharray="1, 1"/>
                <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="0.1"/>
                <!-- Inner Ring -->
                <circle cx="50" cy="50" r="35" fill="none" stroke="currentColor" stroke-width="0.2"/>
                <circle cx="50" cy="50" r="32" fill="none" stroke="currentColor" stroke-width="0.5" stroke-dasharray="2, 4"/>
                <!-- Center Area -->
                <circle cx="50" cy="50" r="15" fill="none" stroke="currentColor" stroke-width="0.1"/>
                <circle cx="50" cy="50" r="5" fill="none" stroke="currentColor" stroke-width="0.3"/>
                
                <!-- Spokes/Lines representing houses -->
                <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(0 50 50)"></line>
                <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(30 50 50)"></line>
                <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(60 50 50)"></line>
                <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(90 50 50)"></line>
                <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(120 50 50)"></line>
                <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(150 50 50)"></line>
                <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(180 50 50)"></line>
                <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(210 50 50)"></line>
                <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(240 50 50)"></line>
                <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(270 50 50)"></line>
                <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(300 50 50)"></line>
                <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(330 50 50)"></line>

                <!-- Inner Spokes -->
                <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5, 0.5" transform="rotate(0 50 50)"></line>
                <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5, 0.5" transform="rotate(45 50 50)"></line>
                <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5, 0.5" transform="rotate(90 50 50)"></line>
                <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5, 0.5" transform="rotate(135 50 50)"></line>
                <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5, 0.5" transform="rotate(180 50 50)"></line>
                <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5, 0.5" transform="rotate(225 50 50)"></line>
                <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5, 0.5" transform="rotate(270 50 50)"></line>
                <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5, 0.5" transform="rotate(315 50 50)"></line>
            </svg>
        </div>

        <!-- Multi-layered Stars -->
        <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(circle at center, #ffffff 1px, transparent 1px); background-size: 50px 50px;"></div>
        <div class="absolute inset-0 opacity-30" style="background-image: radial-gradient(circle at center, #ffffff 1.5px, transparent 1.5px); background-size: 120px 150px;"></div>
        <div class="absolute inset-0 opacity-40 animate-pulse" style="animation-duration: 4s; background-image: radial-gradient(circle at center, #fcd34d 2px, transparent 2px); background-size: 250px 200px;"></div>
    </div>

    <!-- --- MAIN CONTENT: โลโก้ และข้อความ MuteGPT (แนวนอน) --- -->
    <main class="relative z-10 min-h-screen flex items-center justify-center px-6">
        
        <!-- คอนเทนเนอร์จัดเรียงแนวนอน (Flex Row) -->
        <div class="flex items-center justify-center gap-4 md:gap-6">
            
            <!-- ไอคอนวงโคจร (หมุนได้แบบเดิม) -->
            <i data-lucide="orbit" class="text-amber-400 w-16 h-16 md:w-24 md:h-24 animate-spin-10s drop-shadow-[0_0_15px_rgba(251,191,36,0.5)]"></i>
            
            <!-- ข้อความ MuteGPT -->
            <h1 class="text-5xl md:text-7xl font-bold tracking-wide drop-shadow-[0_0_25px_rgba(251,191,36,0.5)]">
                <span class="bg-clip-text text-transparent bg-gradient-to-r from-amber-200 via-yellow-400 to-purple-400">
                    MuteGPT
                </span>
            </h1>

        </div>

    </main>

    <!-- Script สำหรับเรนเดอร์ไอคอน Lucide -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
