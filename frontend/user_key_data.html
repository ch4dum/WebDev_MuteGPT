<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ผูกดวงชะตา - กรอกข้อมูลพื้นฐานเพื่อให้ MuteGPT วิเคราะห์ดวงชะตาเฉพาะบุคคล" />
  <title>ผูกดวงชะตา — MuteGPT</title>
  <!-- นำเข้า Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="css/styles.css?v=2" />
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>

<body>

  <!-- ===== BACKGROUND LAYER ===== -->
  <div class="bg-layer">
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>

    <!-- Zodiac Wheel -->
    <div class="zodiac-wheel">
      <svg viewBox="0 0 100 100" style="width:100%;height:100%;color:#fde68a;">
        <circle cx="50" cy="50" r="49" fill="none" stroke="currentColor" stroke-width="0.2" stroke-dasharray="1,1" />
        <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="0.1" />
        <circle cx="50" cy="50" r="35" fill="none" stroke="currentColor" stroke-width="0.2" />
        <circle cx="50" cy="50" r="32" fill="none" stroke="currentColor" stroke-width="0.5" stroke-dasharray="2,4" />
        <circle cx="50" cy="50" r="15" fill="none" stroke="currentColor" stroke-width="0.1" />
        <circle cx="50" cy="50" r="5" fill="none" stroke="currentColor" stroke-width="0.3" />
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(0 50 50)" />
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(30 50 50)" />
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(60 50 50)" />
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(90 50 50)" />
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(120 50 50)" />
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(150 50 50)" />
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(180 50 50)" />
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(210 50 50)" />
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(240 50 50)" />
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(270 50 50)" />
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(300 50 50)" />
        <line x1="50" y1="15" x2="50" y2="46" stroke="currentColor" stroke-width="0.1" transform="rotate(330 50 50)" />
        <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5,0.5"
          transform="rotate(0 50 50)" />
        <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5,0.5"
          transform="rotate(45 50 50)" />
        <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5,0.5"
          transform="rotate(90 50 50)" />
        <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5,0.5"
          transform="rotate(135 50 50)" />
        <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5,0.5"
          transform="rotate(180 50 50)" />
        <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5,0.5"
          transform="rotate(225 50 50)" />
        <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5,0.5"
          transform="rotate(270 50 50)" />
        <line x1="50" y1="5" x2="50" y2="15" stroke="currentColor" stroke-width="0.1" stroke-dasharray="0.5,0.5"
          transform="rotate(315 50 50)" />
      </svg>
    </div>

    <div class="stars-small"></div>
    <div class="stars-medium"></div>
    <div class="stars-large"></div>
  </div>

  <!-- ===== NAVIGATION ===== -->
  <nav id="navbar" class="navbar">
    <div class="navbar-inner">
      <a href="main.html" class="logo" id="nav-logo">
        <i data-lucide="orbit"></i>
        <span class="logo-text">MuteGPT</span>
      </a>

      <div class="navbar-actions" style="display: flex; align-items: center; gap: 0.75rem; position: relative;">
        <!-- ซ่อนปุ่มแก้ไขประวัติส่วนตัวในหน้านี้เพราะอยู่ในหน้าแก้ไขอยู่แล้ว -->

        <div class="navbar-avatar" id="avatar-btn"
          style="width: 2.5rem; height: 2.5rem; border-radius: 9999px; display: flex; align-items: center; border: 1px solid rgba(147,51,234,0.2); background: rgba(88,28,135,0.5); justify-content: center; cursor: pointer; transition: all 0.2s;">
          <i data-lucide="user" style="width: 1.25rem; height: 1.25rem; color: #fde68a;"></i>
        </div>

        <!-- Account Popup -->
        <div id="account-popup"
          style="display: none; position: absolute; top: calc(100% + 10px); right: 0; background: rgba(10, 5, 20, 0.95); backdrop-filter: blur(16px); border-radius: 1.5rem; width: 340px; box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px rgba(147,51,234,0.2); border: 1px solid rgba(147,51,234,0.3); z-index: 100; overflow: hidden; font-family: 'Inter', 'Prompt', sans-serif;">
          <div style="padding: 1.5rem; text-align: center; position: relative;">
            <button id="close-popup"
              style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: #94a3b8; cursor: pointer; transition: color 0.2s;"
              onmouseover="this.style.color='#fde68a'" onmouseout="this.style.color='#94a3b8'">
              <i data-lucide="x" style="width: 1.25rem; height: 1.25rem;"></i>
            </button>
            <div id="popup-email"
              style="color: #f8fafc; font-size: 0.95rem; font-weight: 500; margin-bottom: 0.25rem; word-break: break-all;">
              loading...</div>
            <div id="popup-managed" style="color: #94a3b8; font-size: 0.8rem; margin-bottom: 1.5rem;"></div>

            <div id="popup-avatar-large"
              style="width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, rgba(88,28,135,0.8), rgba(147,51,234,0.5)); border: 1px solid rgba(251,191,36,0.4); color: #fde68a; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 1rem; position: relative; box-shadow: 0 0 15px rgba(147,51,234,0.4);">
              <span id="popup-avatar-letter"></span>
              <div
                style="position: absolute; bottom: -2px; right: -2px; background: #0a0514; border: 1px solid rgba(147,51,234,0.5); border-radius: 50%; padding: 5px; display: flex;">
                <i data-lucide="camera" style="width: 0.9rem; height: 0.9rem; color: #fde68a;"></i>
              </div>
            </div>

            <div id="popup-greeting"
              style="background: linear-gradient(to right, #f8fafc, #cbd5e1); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem;">
              Hi!</div>

            <button onclick="handleLogout()"
              style="background: linear-gradient(to right, #ef4444, #991b1b); color: #fff; padding: 0.5rem 1.25rem; border-radius: 9999px; border: none; font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.3s; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;"
              onmouseover="this.style.boxShadow='0 0 25px rgba(239, 68, 68, 0.6)'; this.style.transform='translateY(-1px)';"
              onmouseout="this.style.boxShadow='0 0 15px rgba(239, 68, 68, 0.4)'; this.style.transform='none';">
              <i data-lucide="log-out" style="width: 1rem; height: 1rem;"></i>
              ออกจากระบบ
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="profile-main">
    <div class="profile-card">

      <!-- Decorative stars -->
      <i data-lucide="star" class="deco-star deco-star-1"></i>
      <i data-lucide="star" class="deco-star deco-star-2"></i>

      <!-- Header -->
      <div class="profile-header">
        <div class="profile-icon-wrap">
          <img src="assets/LogoSUN.png" alt="Sun Logo" style="width: 80px; height: 80px; object-fit: contain;" />
        </div>
        <h2>ผูกดวงชะตาของคุณ</h2>
        <p>กรุณากรอกข้อมูลเพื่อใช้เป็น Context ให้ AI วิเคราะห์พื้นดวงของคุณอย่างแม่นยำ</p>
      </div>

      <!-- Form -->
      <form id="profile-form" novalidate>
        <div class="profile-form-grid">

          <!-- ชื่อ-นามสกุล -->
          <div class="profile-field col-full">
            <label for="input-fullname">ชื่อ-นามสกุล</label>
            <div class="profile-input-wrap">
              <div class="field-icon"><i data-lucide="user"></i></div>
              <input id="input-fullname" type="text" class="profile-input" placeholder="เช่น สมชาย ใจดี" required />
            </div>
          </div>

          <!-- ชื่อเล่น -->
          <div class="profile-field">
            <label for="input-nickname">ชื่อเล่น</label>
            <div class="profile-input-wrap">
              <div class="field-icon"><i data-lucide="user"></i></div>
              <input id="input-nickname" type="text" class="profile-input" placeholder="เช่น ชาย" required />
            </div>
          </div>

          <!-- เพศ -->
          <div class="profile-field">
            <label>เพศ</label>
            <div class="gender-options">
              <div class="gender-option">
                <input type="radio" id="gender-male" name="gender" value="male" required>
                <label for="gender-male" class="gender-label">
                  ชาย
                </label>
              </div>
              <div class="gender-option">
                <input type="radio" id="gender-female" name="gender" value="female" required>
                <label for="gender-female" class="gender-label">
                  หญิง
                </label>
              </div>
            </div>
          </div>

          <!-- เลขท้ายเบอร์โทรศัพท์ 4 ตัว -->
          <div class="profile-field col-full">
            <label for="input-phone-last4">เลขท้ายเบอร์โทร 4 ตัว</label>
            <div class="profile-input-wrap">
              <div class="field-icon"><i data-lucide="phone"></i></div>
              <input id="input-phone-last4" type="text" class="profile-input" maxlength="4" pattern="\d{4}"
                placeholder="เช่น 9999" required oninput="this.value = this.value.replace(/[^0-9]/g, '');" />
            </div>
          </div>


          <!-- วัน / เดือน / ปีเกิด -->
          <div class="profile-field">
            <label for="input-birthdate">วัน/เดือน/ปีเกิด</label>
            <div class="profile-input-wrap">
              <div class="field-icon"><i data-lucide="calendar"></i></div>
              <input id="input-birthdate" type="text" class="profile-input" inputmode="numeric"
                placeholder="เช่น 31/12/2000" maxlength="10" required />
            </div>
          </div>

          <!-- เวลาเกิด (optional with checkbox toggle) -->
          <div class="profile-field">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; user-select: none;">
              <input type="checkbox" id="toggle-birthtime"
                style="width: 1.1rem; height: 1.1rem; accent-color: #a855f7; cursor: pointer;" />
              <span>ต้องการระบุเวลาเกิด (เวลาตกฟาก)</span>
            </label>
            <div class="profile-input-wrap" id="birthtime-wrap" style="opacity: 0.4; pointer-events: none;">
              <div class="field-icon"><i data-lucide="clock"></i></div>
              <input id="input-birthtime" type="time" class="profile-input" disabled />
            </div>
            <p class="profile-hint" id="birthtime-hint">* ติ๊กเลือกหากทราบเวลาเกิด — ข้อมูลนี้ไม่บังคับ</p>
          </div>

        </div>

        <!-- Submit -->
        <button type="submit" class="btn-profile-submit" id="btn-save-profile">
          <i data-lucide="sparkles"></i>
          บันทึกประวัติดวงดาว
        </button>
      </form>

    </div>
  </main>

  <!-- Toast error (fixed at top of page) -->
  <div class="toast-error" id="toast-error">
    <i data-lucide="alert-circle"></i>
    <span>กรุณากรอกข้อมูลให้ครบถ้วน</span>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    // --- Profile form validation and submission ---
    const profileForm = document.getElementById('profile-form');
    const toastError = document.getElementById('toast-error');
    const profileInputs = profileForm.querySelectorAll('.profile-input');
    let toastTimeout = null;

    // Prevent navigation via logo if form is incomplete
    const navLogo = document.getElementById('nav-logo');
    if (navLogo) {
      navLogo.addEventListener('click', (e) => {
        let hasEmpty = false;
        profileInputs.forEach(input => {
          // ข้ามการเช็คเวลาเกิดถ้า checkbox ไม่ได้ติ๊ก
          if (input.id === 'input-birthtime' && !document.getElementById('toggle-birthtime').checked) return;
          if (input.value.trim() === '') hasEmpty = true;
        });
        const genderSelected = document.querySelector('input[name="gender"]:checked');
        if (!genderSelected) hasEmpty = true;

        if (hasEmpty) {
          e.preventDefault();
        }
      });
    }

    const birthdateInput = document.getElementById('input-birthdate');

    function isoDateToDisplay(isoDate) {
      if (!isoDate) return '';
      const [year, month, day] = isoDate.split('-');
      if (!year || !month || !day) return isoDate;
      return `${day}/${month}/${year}`;
    }

    function displayDateToIso(displayDate) {
      const match = displayDate.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (!match) return null;

      const day = match[1].padStart(2, '0');
      const month = match[2].padStart(2, '0');
      const year = match[3];
      const isoDate = `${year}-${month}-${day}`;
      const parsed = new Date(`${isoDate}T00:00:00`);

      if (
        Number.isNaN(parsed.getTime()) ||
        parsed.getFullYear() !== Number(year) ||
        parsed.getMonth() + 1 !== Number(month) ||
        parsed.getDate() !== Number(day)
      ) {
        return null;
      }

      return isoDate;
    }

    if (birthdateInput) {
      if (window.flatpickr) {
        flatpickr(birthdateInput, {
          dateFormat: 'd/m/Y',
          allowInput: true,
          maxDate: 'today',
          disableMobile: true,
        });
      }

      birthdateInput.addEventListener('blur', () => {
        const digits = birthdateInput.value.replace(/\D/g, '');
        if (digits.length !== 8) return;

        const parts = [];
        parts.push(digits.slice(0, 2));
        parts.push(digits.slice(2, 4));
        parts.push(digits.slice(4, 8));
        birthdateInput.value = parts.join('/');
      });
    }

    // --- Toggle เวลาเกิด ---
    const toggleBirthtime = document.getElementById('toggle-birthtime');
    const birthtimeWrap = document.getElementById('birthtime-wrap');
    const birthtimeInput = document.getElementById('input-birthtime');
    const birthtimeHint = document.getElementById('birthtime-hint');

    if (toggleBirthtime) {
      toggleBirthtime.addEventListener('change', () => {
        const isChecked = toggleBirthtime.checked;
        birthtimeWrap.style.opacity = isChecked ? '1' : '0.4';
        birthtimeWrap.style.pointerEvents = isChecked ? 'auto' : 'none';
        birthtimeInput.disabled = !isChecked;
        if (!isChecked) {
          birthtimeInput.value = '';
          birthtimeInput.classList.remove('input-error');
          birthtimeHint.textContent = '* ติ๊กเลือกหากทราบเวลาเกิด — ข้อมูลนี้ไม่บังคับ';
        } else {
          birthtimeHint.textContent = '* หากไม่ทราบแน่ชัด ให้ระบุ 06:00 น.';
          birthtimeInput.focus();
        }
      });
    }

    // --- Load Profile Data ---
    async function loadProfile() {
      const checkClient = setInterval(async () => {
        if (typeof supabaseClient !== 'undefined' && supabaseClient) {
          clearInterval(checkClient);
          try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && session.user) {

              // === UPDATE POPUP UI ===
              const userEmail = session.user.email;
              if (userEmail) {
                const elEmail = document.getElementById('popup-email');
                if (elEmail) elEmail.textContent = userEmail;

                const domain = userEmail.split('@')[1];
                const elManaged = document.getElementById('popup-managed');
                if (domain && elManaged) {
                  elManaged.textContent = 'Managed by ' + domain;
                }
              }

              const { data: profile, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', session.user.id)
                .single();

              if (profile) {
                if (profile.full_name) document.getElementById('input-fullname').value = profile.full_name;
                if (profile.nickname) document.getElementById('input-nickname').value = profile.nickname;
                if (profile.phone_last4) document.getElementById('input-phone-last4').value = profile.phone_last4;
                if (profile.birth_date) document.getElementById('input-birthdate').value = isoDateToDisplay(profile.birth_date);
                if (profile.birth_time) {
                  document.getElementById('input-birthtime').value = profile.birth_time;
                  // เปิด checkbox และ enable ช่องเวลาเกิดอัตโนมัติ
                  const toggle = document.getElementById('toggle-birthtime');
                  if (toggle) {
                    toggle.checked = true;
                    toggle.dispatchEvent(new Event('change'));
                  }
                }
                if (profile.gender) {
                  const genderRadio = document.querySelector(`input[name="gender"][value="${profile.gender}"]`);
                  if (genderRadio) genderRadio.checked = true;
                }
              }

              // Update Popup Greeting and Avatar Name
              const displayName = (profile && profile.full_name) ? profile.full_name : (userEmail ? userEmail.split('@')[0] : 'USER');
              const elGreeting = document.getElementById('popup-greeting');
              if (elGreeting) elGreeting.textContent = 'Hi, ' + displayName.toUpperCase() + '!';

              const firstLetter = displayName.charAt(0).toUpperCase();
              const elPopupLetter = document.getElementById('popup-avatar-letter');
              if (elPopupLetter) elPopupLetter.textContent = firstLetter;

              const avatarBtn = document.getElementById('avatar-btn');
              if (avatarBtn) {
                avatarBtn.innerHTML = `<span style="color: #fde68a; font-weight: bold; font-size: 1.1rem;">${firstLetter}</span>`;
              }

            }
          } catch (err) {
            console.error("Error loading profile:", err);
          }
        }
      }, 100);
    }

    // --- Popup Toggle Logic ---
    document.addEventListener('DOMContentLoaded', () => {
      const avatarBtn = document.getElementById('avatar-btn');
      const accountPopup = document.getElementById('account-popup');
      const closePopup = document.getElementById('close-popup');

      if (avatarBtn && accountPopup) {
        avatarBtn.addEventListener('click', () => {
          accountPopup.style.display = accountPopup.style.display === 'none' ? 'block' : 'none';
        });

        if (closePopup) {
          closePopup.addEventListener('click', () => {
            accountPopup.style.display = 'none';
          });
        }

        // Close popup when clicking outside
        document.addEventListener('click', (e) => {
          if (!avatarBtn.contains(e.target) && !accountPopup.contains(e.target)) {
            accountPopup.style.display = 'none';
          }
        });
      }
    });

    // Call load profile
    loadProfile();

    // Clear error state on input change
    profileInputs.forEach(input => {
      const clearError = () => {
        if (input.value.trim() !== '') {
          input.classList.remove('input-error');
        }
      };
      input.addEventListener('input', clearError);
      input.addEventListener('change', clearError);
    });

    /**
     * Shows an error toast notification.
     */
    function showErrorToast(message = 'กรุณากรอกข้อมูลให้ครบถ้วน') {
      toastError.querySelector('span').textContent = message;
      toastError.classList.remove('show');
      clearTimeout(toastTimeout);
      void toastError.offsetWidth; // Force reflow
      toastError.classList.add('show');
      toastTimeout = setTimeout(() => {
        toastError.classList.remove('show');
      }, 2000);
    }

    /**
     * Shows a success toast notification.
     */
    function showToast(message = 'บันทึกข้อมูลสำเร็จ!') {
      toastError.querySelector('span').textContent = message;
      // Apply success styling
      toastError.style.background = '#10b981'; // green
      toastError.style.boxShadow = '0 4px 20px rgba(16, 185, 129, 0.4)'; // green glow
      toastError.classList.remove('show');
      clearTimeout(toastTimeout);
      void toastError.offsetWidth; // Force reflow
      toastError.classList.add('show');
      toastTimeout = setTimeout(() => {
        toastError.classList.remove('show');
        // Redirect to main page after toast disappears
        window.location.href = 'main.html';
      }, 1000);
    }

    // Handle form submission
    profileForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      // 1. Check if Supabase is initialized and user is logged in
      if (!supabaseClient) {
        showErrorToast('ระบบยังไม่พร้อมใช้งาน กรุณารอสักครู่');
        return;
      }

      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        alert('กรุณาเข้าสู่ระบบก่อนทำรายการ');
        window.location.href = 'index.html';
        return;
      }

      let hasEmpty = false;
      const isBirthtimeEnabled = document.getElementById('toggle-birthtime').checked;
      profileInputs.forEach(input => {
        // ข้ามการเช็คเวลาเกิดถ้า checkbox ไม่ได้ติ๊ก
        if (input.id === 'input-birthtime' && !isBirthtimeEnabled) {
          input.classList.remove('input-error');
          return;
        }
        if (input.value.trim() === '') {
          input.classList.remove('input-error');
          void input.offsetWidth;
          input.classList.add('input-error');
          hasEmpty = true;
        } else {
          input.classList.remove('input-error');
        }
      });

      const genderSelected = document.querySelector('input[name="gender"]:checked');
      const genderRadios = document.querySelectorAll('input[name="gender"]');
      if (!genderSelected) {
        hasEmpty = true;
        genderRadios.forEach(radio => {
          radio.classList.remove('input-error');
          void radio.offsetWidth;
          radio.classList.add('input-error');
        });
      } else {
        genderRadios.forEach(radio => radio.classList.remove('input-error'));
      }

      if (hasEmpty) {
        showErrorToast('กรุณากรอกข้อมูลให้ครบถ้วน');
        return;
      }

      const birthDateIso = displayDateToIso(birthdateInput.value);
      if (!birthDateIso) {
        birthdateInput.classList.remove('input-error');
        void birthdateInput.offsetWidth;
        birthdateInput.classList.add('input-error');
        showErrorToast('กรุณากรอกวันเกิดเป็นรูปแบบ วัน/เดือน/ปี เช่น 31/12/2000');
        return;
      }

      // Prevent future dates
      if (birthdateInput && birthDateIso) {
        const selectedDate = new Date(`${birthDateIso}T00:00:00`);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        if (selectedDate > today) {
          birthdateInput.classList.remove('input-error');
          void birthdateInput.offsetWidth;
          birthdateInput.classList.add('input-error');
          showErrorToast('ไม่สามารถใส่วันที่ในอนาคตได้');
          return;
        }
      }

      // --- 2. Save data to Supabase ---
      try {
        const profileData = {
          id: user.id, // Linked to Auth User ID
          full_name: document.getElementById('input-fullname').value,
          nickname: document.getElementById('input-nickname').value,
          phone_last4: document.getElementById('input-phone-last4').value,
          birth_date: birthDateIso,
          birth_time: document.getElementById('toggle-birthtime').checked ? document.getElementById('input-birthtime').value : null,
          gender: genderSelected.value,
          updated_at: new Date()
        };

        const { error } = await supabaseClient
          .from('profiles')
          .upsert(profileData);

        if (error) throw error;

        // Success state
        const btnSubmit = document.getElementById('btn-save-profile');
        btnSubmit.innerHTML = '<i data-lucide="check"></i> บันทึกสำเร็จ!';
        btnSubmit.style.backgroundColor = '#10b981';
        if (window.lucide) lucide.createIcons();
        // Show success toast
        showToast('บันทึกประวัติดวงดาวของคุณเรียบร้อยแล้ว!');
      } catch (err) {
        console.error('Error saving profile:', err.message);
        showErrorToast('เกิดข้อผิดพลาดในการบันทึกข้อมูล: ' + err.message);
      }
    });
  </script>
</body>

</html>
