<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love Oracle - พยากรณ์ความรัก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
      /* กำหนดตัวแปรสี (RGB) สำหรับทำ Dynamic Theme */
      :root {
        /* Love theme (Red/Rose) */
        --c-primary: 239 68 68;
        /* red-500 */
        --c-secondary: 190 18 60;
        /* rose-700 */
        --c-accent: 248 113 113;
        /* red-400 */
        --c-light: 254 202 202;
        /* red-200 */
        --c-dark: 127 29 29;
        /* red-900 */
      }

      body.theme-single {
        --c-primary: 239 68 68;
        --c-secondary: 190 18 60;
        --c-accent: 248 113 113;
        --c-light: 254 202 202;
        --c-dark: 127 29 29;
      }

      body.theme-talking {
        --c-primary: 225 29 72;
        --c-secondary: 159 18 57;
        --c-accent: 251 113 133;
        --c-light: 255 228 230;
        --c-dark: 136 19 55;
      }

      body.theme-couple {
        --c-primary: 220 38 38;
        --c-secondary: 153 27 27;
        --c-accent: 252 165 165;
        --c-light: 254 226 226;
        --c-dark: 127 29 29;
      }

      body.theme-broken {
        --c-primary: 185 28 28;
        --c-secondary: 127 29 29;
        --c-accent: 248 113 113;
        --c-light: 254 202 202;
        --c-dark: 69 10 10;
      }

      body {
        font-family: "Prompt", sans-serif;
        transition: background-color 0.8s ease;
      }

      /* Scrollbar อิงตามสีธีม */
      ::-webkit-scrollbar {
        width: 6px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: rgb(var(--c-primary));
        border-radius: 4px;
        transition: background 0.8s ease;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgb(var(--c-secondary));
      }

      @keyframes typing {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.5;
        }
        30% {
          transform: translateY(-5px);
          opacity: 1;
        }
      }

      .typing-dot {
        animation: typing 1.2s infinite;
      }
      .typing-dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing-dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes fadeSlideIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .msg-animate {
        animation: fadeSlideIn 0.35s ease forwards;
      }

      /* Markdown Styles */
      .markdown-content p {
        margin-bottom: 0.75rem;
      }
      .markdown-content p:last-child {
        margin-bottom: 0;
      }
      .markdown-content h1,
      .markdown-content h2,
      .markdown-content h3 {
        color: rgb(var(--c-light));
        font-weight: 700;
        line-height: 1.35;
        margin: 0.75rem 0 0.5rem;
      }
      .markdown-content h1 {
        font-size: 1.25rem;
      }
      .markdown-content h2 {
        font-size: 1.15rem;
      }
      .markdown-content h3 {
        font-size: 1.05rem;
      }
      .markdown-content strong {
        color: rgb(var(--c-accent));
        font-weight: 600;
      }
      .markdown-content em {
        color: rgb(var(--c-light));
      }
      .markdown-content ul,
      .markdown-content ol {
        margin-left: 1.5rem;
        margin-bottom: 0.75rem;
      }
      .markdown-content ul {
        list-style-type: disc;
      }
      .markdown-content ol {
        list-style-type: decimal;
      }
      .markdown-content li {
        margin-bottom: 0.25rem;
      }
      .markdown-content blockquote {
        border-left: 3px solid rgb(var(--c-primary));
        padding-left: 0.9rem;
        margin: 0.75rem 0;
        color: rgb(var(--c-light));
        background: rgb(var(--c-dark) / 0.18);
        border-radius: 0.5rem;
      }
      .markdown-content code {
        background: rgb(15 23 42 / 0.75);
        color: rgb(var(--c-light));
        border: 1px solid rgb(var(--c-primary) / 0.2);
        border-radius: 0.35rem;
        padding: 0.1rem 0.35rem;
        font-size: 0.9em;
      }
      .markdown-content pre {
        background: rgb(15 23 42 / 0.9);
        border: 1px solid rgb(var(--c-primary) / 0.25);
        border-radius: 0.75rem;
        padding: 0.9rem;
        overflow-x: auto;
        margin: 0.75rem 0;
      }
      .markdown-content pre code {
        background: transparent;
        border: none;
        padding: 0;
      }
      .markdown-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 0.75rem 0;
        font-size: 0.9em;
      }
      .markdown-content th,
      .markdown-content td {
        border: 1px solid rgb(var(--c-primary) / 0.25);
        padding: 0.5rem;
        text-align: left;
      }
      .markdown-content th {
        color: rgb(var(--c-light));
        background: rgb(var(--c-dark) / 0.35);
      }
      .markdown-content hr {
        border: none;
        border-top: 1px solid rgb(var(--c-primary) / 0.25);
        margin: 1rem 0;
      }
    </style>
  </head>

  <body
    class="bg-[#050305] text-slate-200 h-screen flex flex-col overflow-hidden relative selection:bg-[rgb(var(--c-primary)/0.3)] theme-single"
  >
    <!-- --- BACKGROUND (ใช้ background.jpg เหมือนหน้าอื่นๆ) --- -->
    <div
      class="fixed inset-0 z-0 pointer-events-none overflow-hidden"
      style="
        background:
          linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
          url(&quot;assets/background.jpg&quot;) no-repeat center center fixed;
        background-size: cover;
      "
    >
      <div
        class="absolute top-[-20%] left-[-10%] w-[70%] h-[70%] bg-red-950/20 rounded-full blur-[150px] mix-blend-screen"
      ></div>
      <div
        class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] bg-rose-900/15 rounded-full blur-[120px] mix-blend-screen"
      ></div>
      <div
        class="absolute inset-0 opacity-[0.03]"
        style="
          background-image: radial-gradient(
            circle at center,
            #ffffff 1px,
            transparent 1px
          );
          background-size: 30px 30px;
        "
      ></div>
    </div>

    <!-- --- ASTROLOGY & STARS BACKGROUND (Dynamic Theme) --- -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
      <!-- Nebula Glow -->
      <div
        class="absolute top-[-20%] left-[-10%] w-[70%] h-[70%] bg-[rgb(var(--c-dark)/0.4)] rounded-full blur-[150px] mix-blend-screen theme-transition"
      ></div>
      <div
        class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] bg-[rgb(var(--c-secondary)/0.2)] rounded-full blur-[120px] mix-blend-screen theme-transition"
      ></div>
      <div
        class="absolute top-[20%] left-[50%] translate-x-[-50%] w-[80%] h-[50%] bg-[rgb(var(--c-primary)/0.1)] rounded-full blur-[180px] mix-blend-screen theme-transition"
      ></div>
    </div>

    <!-- NAVBAR (Dynamic Theme) -->
    <nav
      class="relative z-20 w-full bg-[#050305]/80 backdrop-blur-md border-b border-[rgb(var(--c-primary)/0.2)] py-3 shadow-[0_4px_30px_rgba(0,0,0,0.5)] shrink-0 theme-transition"
    >
      <div
        class="container mx-auto px-4 flex justify-between items-center max-w-4xl"
      >
        <div class="flex items-center gap-4">
          <a
            href="main.html"
            class="p-2 rounded-full hover:bg-white/10 text-slate-400 hover:text-white transition-colors"
          >
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
          </a>
          <div class="flex items-center gap-3">
            <div
              class="w-10 h-10 rounded-full bg-[rgb(var(--c-dark)/0.5)] border border-[rgb(var(--c-primary)/0.3)] flex items-center justify-center shadow-inner theme-transition"
            >
              <i
                data-lucide="heart"
                class="w-5 h-5 text-[rgb(var(--c-accent))] theme-transition"
              ></i>
            </div>
            <div>
              <h1
                class="text-xl font-bold text-white leading-none tracking-wide"
              >
                Love Oracle 💖
              </h1>
              <p
                class="text-[11px] text-[rgb(var(--c-light))] mt-1 theme-transition"
              >
                AI พยากรณ์ดวงความรักเฉพาะคุณ
              </p>
            </div>
          </div>
        </div>

        <!-- ปุ่มออกจากระบบ + ไอคอนโปรไฟล์ -->
        <div class="flex items-center gap-3 relative">
          <div
            id="avatar-btn"
            class="w-10 h-10 rounded-full flex items-center justify-center border cursor-pointer hover:scale-105 transition-all bg-[rgb(var(--c-dark)/0.5)] border-[rgb(var(--c-primary)/0.3)] shadow-[0_0_15px_rgb(var(--c-primary)/0.2)] theme-transition"
          >
            <i
              data-lucide="user"
              class="w-5 h-5 text-[rgb(var(--c-accent))] theme-transition"
            ></i>
          </div>

          <!-- Account Popup -->
          <div
            id="account-popup"
            class="absolute top-[calc(100%+10px)] right-0 bg-[#0a0514]/95 backdrop-blur-xl rounded-3xl w-[340px] shadow-[0_10px_40px_rgba(0,0,0,0.8),0_0_20px_rgb(var(--c-primary)/0.2)] border border-[rgb(var(--c-primary)/0.3)] z-[100] overflow-hidden theme-transition"
            style="
              display: none;
              font-family: &quot;Inter&quot;, &quot;Prompt&quot;, sans-serif;
            "
          >
            <div class="p-6 text-center relative">
              <button
                id="close-popup"
                class="absolute top-4 right-4 bg-transparent border-none text-slate-400 hover:text-[rgb(var(--c-accent))] cursor-pointer transition-colors theme-transition"
              >
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
              <div
                id="popup-email"
                class="text-slate-50 text-[0.95rem] font-medium mb-1 break-all"
              >
                loading...
              </div>
              <div id="popup-managed" class="text-slate-400 text-xs mb-6"></div>

              <div
                id="popup-avatar-large"
                class="w-20 h-20 rounded-full bg-gradient-to-br from-[rgb(var(--c-dark)/0.8)] to-[rgb(var(--c-primary)/0.5)] border border-[rgb(var(--c-accent)/0.4)] text-[rgb(var(--c-light))] flex items-center justify-center text-4xl mx-auto mb-4 relative shadow-[0_0_15px_rgb(var(--c-primary)/0.4)] theme-transition"
              >
                <span id="popup-avatar-letter"></span>
                <div
                  class="absolute -bottom-0.5 -right-0.5 bg-[#0a0514] border border-[rgb(var(--c-primary)/0.5)] rounded-full p-1.5 flex theme-transition"
                >
                  <i
                    data-lucide="camera"
                    class="w-3.5 h-3.5 text-[rgb(var(--c-light))] theme-transition"
                  ></i>
                </div>
              </div>

              <div
                id="popup-greeting"
                class="bg-gradient-to-r from-[rgb(var(--c-light))] to-[rgb(var(--c-accent))] bg-clip-text text-transparent text-xl font-bold mb-6 theme-transition"
              >
                Hi!
              </div>

              <button
                onclick="handleLogout()"
                class="bg-gradient-to-r from-red-500 to-red-800 text-white py-2 px-5 rounded-full border-none text-sm font-semibold cursor-pointer transition-all shadow-[0_0_15px_rgba(239,68,68,0.4)] hover:shadow-[0_0_25px_rgba(239,68,68,0.6)] hover:-translate-y-[1px] inline-flex items-center justify-center gap-2"
              >
                <i data-lucide="log-out" class="w-4 h-4"></i>
                ออกจากระบบ
              </button>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <!-- CHAT AREA -->
    <main
      class="relative z-10 flex-1 w-full max-w-4xl mx-auto flex flex-col min-h-0 bg-[#0a0508]/50 backdrop-blur-sm border-x border-white/5 shadow-2xl"
    >
      <div
        id="chat-messages"
        class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 scroll-smooth"
      >
        <!-- ข้อความต้อนรับ -->
        <div class="flex gap-3 msg-animate">
          <div
            class="w-10 h-10 rounded-full bg-gradient-to-br from-[rgb(var(--c-primary))] to-[rgb(var(--c-dark))] border border-[rgb(var(--c-accent))] flex items-center justify-center shrink-0 shadow-[0_0_15px_rgb(var(--c-accent)/0.3)] mt-1 theme-transition"
          >
            <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
          </div>
          <div class="flex flex-col gap-1 max-w-[85%] md:max-w-[75%] w-full">
            <span
              class="text-xs text-[rgb(var(--c-light))] ml-1 theme-transition"
              >แม่หมอ AI</span
            >
            <div
              class="bg-[#12050a]/90 p-4 rounded-2xl rounded-tl-sm border border-[rgb(var(--c-primary)/0.3)] text-slate-200 text-sm md:text-base leading-relaxed shadow-lg theme-transition"
            >
              สวัสดีค่ะ ยินดีต้อนรับสู่ Love Oracle นะคะ ✨<br /><br />
              เพื่อให้คำทำนายแม่นยำและตรงจุดที่สุด แม่หมอขออนุญาตทราบ
              <b>"สถานะหัวใจ"</b>
              ของคุณในตอนนี้ก่อนนะคะ
            </div>
          </div>
        </div>

        <!-- ตัวเลือกสถานะ -->
        <div
          id="status-selection"
          class="flex flex-col gap-3 pl-14 pr-4 msg-animate"
          style="animation-delay: 0.5s"
        >
          <!-- คนโสด -->
          <button
            onclick="
              selectStatus(
                'single',
                'คนโสด',
                'การเจอเนื้อคู่ หรือเสน่ห์ในช่วงนี้',
              )
            "
            class="w-full text-left p-4 rounded-xl border border-red-500/30 bg-red-950/30 hover:bg-red-900/40 transition-all flex items-center gap-4 group shadow-md"
          >
            <div
              class="w-10 h-10 rounded-full bg-red-500/20 border border-red-500/30 flex items-center justify-center group-hover:scale-110 transition-transform shrink-0"
            >
              <i data-lucide="user" class="w-5 h-5 text-red-400"></i>
            </div>
            <div>
              <div class="font-bold text-red-200">คนโสด (Single)</div>
              <div class="text-xs text-slate-400 mt-0.5">
                เน้นเรื่องการเจอเนื้อคู่ เสน่ห์ หรือคนที่จะเข้ามา
              </div>
            </div>
          </button>
          <!-- คนมีคนคุย -->
          <button
            onclick="
              selectStatus(
                'talking',
                'คนมีคนคุย',
                'ความชัดเจน และความรู้สึกของอีกฝ่าย',
              )
            "
            class="w-full text-left p-4 rounded-xl border border-rose-500/30 bg-rose-950/30 hover:bg-rose-900/40 transition-all flex items-center gap-4 group shadow-md"
          >
            <div
              class="w-10 h-10 rounded-full bg-rose-500/20 border border-rose-500/30 flex items-center justify-center group-hover:scale-110 transition-transform shrink-0"
            >
              <i
                data-lucide="message-circle-heart"
                class="w-5 h-5 text-rose-400"
              ></i>
            </div>
            <div>
              <div class="font-bold text-rose-200">คนมีคนคุย (Talking)</div>
              <div class="text-xs text-slate-400 mt-0.5">
                เน้นเรื่องความชัดเจน เขารู้สึกยังไงกับเรา
              </div>
            </div>
          </button>
          <!-- คนมีคู่ -->
          <button
            onclick="
              selectStatus(
                'couple',
                'คนมีคู่/มีแฟน',
                'ความสัมพันธ์ ความมั่นคง หรือสิ่งที่ต้องระวัง',
              )
            "
            class="w-full text-left p-4 rounded-xl border border-red-400/30 bg-[#220808]/60 hover:bg-[#2f0b0b]/80 transition-all flex items-center gap-4 group shadow-md"
          >
            <div
              class="w-10 h-10 rounded-full bg-red-400/20 border border-red-400/30 flex items-center justify-center group-hover:scale-110 transition-transform shrink-0"
            >
              <i data-lucide="users" class="w-5 h-5 text-red-300"></i>
            </div>
            <div>
              <div class="font-bold text-red-100">
                คนมีคู่/มีแฟน (In a relationship)
              </div>
              <div class="text-xs text-slate-400 mt-0.5">
                เน้นเรื่องความสัมพันธ์ ความมั่นคง สิ่งที่ต้องระวัง
              </div>
            </div>
          </button>
          <!-- คนเพิ่งเลิก -->
          <button
            onclick="
              selectStatus(
                'broken',
                'คนเพิ่งเลิก',
                'โอกาสการกลับมา หรือการ Move on',
              )
            "
            class="w-full text-left p-4 rounded-xl border border-red-900/50 bg-[#160707]/70 hover:bg-[#240909]/80 transition-all flex items-center gap-4 group shadow-md"
          >
            <div
              class="w-10 h-10 rounded-full bg-red-900/30 border border-red-700/40 flex items-center justify-center group-hover:scale-110 transition-transform shrink-0"
            >
              <i data-lucide="heart-crack" class="w-5 h-5 text-red-300"></i>
            </div>
            <div>
              <div class="font-bold text-red-100">
                คนเพิ่งเลิก (Recently broken up)
              </div>
              <div class="text-xs text-slate-400 mt-0.5">
                เน้นเรื่องโอกาสการกลับมา หรือแนวทางการ Move on
              </div>
            </div>
          </button>
        </div>
      </div>

      <!-- Typing Indicator -->
      <div id="typing-indicator" class="hidden px-4 md:px-6 pb-4 shrink-0">
        <div class="flex gap-3">
          <div
            class="w-8 h-8 rounded-full bg-[rgb(var(--c-dark)/0.5)] border border-[rgb(var(--c-accent)/0.5)] flex items-center justify-center shrink-0 theme-transition"
          >
            <i
              data-lucide="sparkles"
              class="w-4 h-4 text-[rgb(var(--c-light))] theme-transition"
            ></i>
          </div>
          <div
            class="bg-[#12050a]/90 py-3 px-4 rounded-2xl rounded-tl-sm border border-[rgb(var(--c-primary)/0.3)] flex gap-1 items-center w-fit shadow-lg theme-transition"
          >
            <div
              class="w-2 h-2 rounded-full typing-dot bg-[rgb(var(--c-accent))] opacity-70 theme-transition"
            ></div>
            <div
              class="w-2 h-2 rounded-full typing-dot bg-[rgb(var(--c-accent))] opacity-70 theme-transition"
            ></div>
            <div
              class="w-2 h-2 rounded-full typing-dot bg-[rgb(var(--c-accent))] opacity-70 theme-transition"
            ></div>
          </div>
        </div>
      </div>

      <!-- INPUT AREA -->
      <div
        class="w-full bg-[#050305]/90 backdrop-blur-xl border-t border-[rgb(var(--c-primary)/0.3)] p-4 shrink-0 relative z-20 theme-transition"
      >
        <div class="max-w-4xl mx-auto relative flex items-center gap-2">
          <input
            type="text"
            id="user-input"
            disabled
            placeholder="กรุณาเลือกสถานะด้านบนก่อนนะคะ..."
            class="w-full bg-[#0f050a] border border-slate-700 focus:border-[rgb(var(--c-primary))] text-white rounded-full py-3 px-6 pr-14 outline-none transition-all placeholder:text-slate-600 disabled:opacity-50 disabled:cursor-not-allowed shadow-inner"
            onkeydown="
              if (event.key === 'Enter') {
                sendMessage();
              }
            "
          />
          <button
            id="send-btn"
            disabled
            onclick="sendMessage()"
            class="absolute right-2 top-1.5 w-10 h-10 rounded-full bg-gradient-to-r from-[rgb(var(--c-primary))] to-[rgb(var(--c-secondary))] flex items-center justify-center text-white hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed shadow-[0_0_10px_rgb(var(--c-accent)/0.4)] theme-transition"
          >
            <i data-lucide="send" class="w-4 h-4 ml-1"></i>
          </button>
        </div>
        <p class="text-center text-[10px] text-slate-500 mt-2">
          AI อาจให้คำทำนายที่ไม่ถูกต้องเสมอไป โปรดใช้วิจารณญาณ
        </p>
      </div>
    </main>

    <!-- Supabase SDK & App Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
      lucide.createIcons();

      // chatState เพิ่ม "AWAITING_FAN_BIRTHDAY" สำหรับรอกรอกวันเกิดแฟน
      let chatState = "AWAITING_STATUS";
      let userData = {
        statusKey: "",
        statusLabel: "",
        statusFocus: "",
        fanBirthdate: null,
        question: "",
      };

      const chatMessages = document.getElementById("chat-messages");
      const userInput = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const typingIndicator = document.getElementById("typing-indicator");

      if (window.marked) {
        marked.setOptions({
          breaks: true,
          gfm: true,
        });
      }

      function scrollToBottom() {
        setTimeout(() => {
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 100);
      }

      function showTyping(show) {
        if (show) {
          typingIndicator.classList.remove("hidden");
          scrollToBottom();
        } else {
          typingIndicator.classList.add("hidden");
        }
      }

      function appendUserMessage(text) {
        const msgHTML = `
                <div class="flex gap-3 justify-end msg-animate">
                    <div class="flex flex-col gap-1 max-w-[85%] md:max-w-[75%] items-end">
                        <div class="bg-gradient-to-br from-[rgb(var(--c-primary))] to-[rgb(var(--c-secondary))] p-4 rounded-2xl rounded-tr-sm text-white text-sm md:text-base leading-relaxed shadow-lg theme-transition">
                            ${text}
                        </div>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center shrink-0 overflow-hidden">
                         <span class="text-[rgb(var(--c-light))] font-bold theme-transition">P</span>
                    </div>
                </div>
            `;
        chatMessages.insertAdjacentHTML("beforeend", msgHTML);
        scrollToBottom();
      }

      function appendAIMessage(text) {
        // แปลง Markdown เป็น HTML ด้วย marked.js
        const htmlContent = window.marked ? marked.parse(text) : text;
        
        const msgHTML = `
                <div class="flex gap-3 msg-animate w-full">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-[rgb(var(--c-primary))] to-[rgb(var(--c-dark))] border border-[rgb(var(--c-accent))] flex items-center justify-center shrink-0 shadow-[0_0_15px_rgb(var(--c-accent)/0.3)] mt-1 theme-transition">
                        <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
                    </div>
                    <div class="flex flex-col gap-1 max-w-[85%] md:max-w-[75%] w-full">
                        <span class="text-xs text-[rgb(var(--c-light))] ml-1 theme-transition">แม่หมอ AI</span>
                        <div class="bg-[#12050a]/90 p-4 rounded-2xl rounded-tl-sm border border-[rgb(var(--c-primary)/0.3)] text-slate-200 text-sm md:text-base leading-relaxed shadow-lg overflow-hidden w-full theme-transition markdown-content">
                            ${htmlContent}
                        </div>
                    </div>
                </div>
            `;
        chatMessages.insertAdjacentHTML("beforeend", msgHTML);
        lucide.createIcons();
        scrollToBottom();
      }

      async function getUserProfile() {
        try {
          const {
            data: { session },
          } = await supabaseClient.auth.getSession();

          if (!session?.user) return {};

          const { data: profileData } = await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id", session.user.id)
            .single();

          return profileData || {};
        } catch (err) {
          console.error(err);
          return {};
        }
      }

      async function fetchJsonWithTimeout(url, options = {}, timeoutMs = 45000) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

        try {
          const res = await fetch(url, {
            ...options,
            signal: controller.signal,
          });
          const data = await res.json();
          return { res, data };
        } finally {
          clearTimeout(timeoutId);
        }
      }

      // ─────────────────────────────────────────────────────────────
      // ฟังก์ชันแสดง UI กรอกวันเกิดแฟน/คนคุย
      // ─────────────────────────────────────────────────────────────
      function appendFanBirthdayPrompt(key, label) {
        const personLabel = key === "talking" ? "คนที่คุณคุยด้วย" : "แฟนคุณ";
        const promptHTML = `
          <div id="fan-birthday-prompt" class="flex gap-3 msg-animate w-full">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-[rgb(var(--c-primary))] to-[rgb(var(--c-dark))] border border-[rgb(var(--c-accent))] flex items-center justify-center shrink-0 shadow-[0_0_15px_rgb(var(--c-accent)/0.3)] mt-1 theme-transition">
              <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
            </div>
            <div class="flex flex-col gap-3 max-w-[85%] md:max-w-[75%] w-full">
              <span class="text-xs text-[rgb(var(--c-light))] ml-1 theme-transition">แม่หมอ AI</span>
              <div class="bg-[#12050a]/90 p-4 rounded-2xl rounded-tl-sm border border-[rgb(var(--c-primary)/0.3)] text-slate-200 text-sm md:text-base leading-relaxed shadow-lg theme-transition">
                เพื่อให้การทำนายดวงความรักแม่นยำยิ่งขึ้น แม่หมออยากรู้
                <b class="text-[rgb(var(--c-accent))] theme-transition">วันเกิดของ${personLabel}</b>
                ด้วยนะคะ 🔮<br>
                <span class="text-xs text-slate-400">(ถ้าไม่ทราบ กดข้ามได้เลยค่ะ ไม่เป็นไรนะคะ)</span>
              </div>
              <div class="flex items-center gap-2 pl-1 flex-wrap">
                <div class="relative flex-1 min-w-[160px]">
                  <input
                    type="date"
                    id="fan-birthday-input"
                    class="w-full bg-[#0f050a] border border-[rgb(var(--c-primary)/0.4)] focus:border-[rgb(var(--c-primary))] text-white rounded-xl py-2.5 px-4 outline-none transition-all text-sm shadow-inner [color-scheme:dark]"
                  />
                </div>
                <button
                  onclick="confirmFanBirthday('${key}', '${label}')"
                  class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-[rgb(var(--c-primary))] to-[rgb(var(--c-secondary))] text-white text-sm font-semibold hover:scale-105 active:scale-95 transition-all shadow-[0_0_10px_rgb(var(--c-accent)/0.3)] whitespace-nowrap theme-transition"
                >
                  ✨ ยืนยัน
                </button>
                <button
                  onclick="skipFanBirthday('${key}', '${label}')"
                  class="px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 text-slate-400 hover:text-white text-sm hover:bg-white/10 active:scale-95 transition-all whitespace-nowrap"
                >
                  ข้าม
                </button>
              </div>
            </div>
          </div>`;
        chatMessages.insertAdjacentHTML("beforeend", promptHTML);
        lucide.createIcons();
        scrollToBottom();
      }

      // บันทึกวันเกิดแฟนลง Supabase (column: birth_FAN)
      async function saveFanBirthday(dateValue) {
        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          if (session && session.user) {
            const { error } = await supabaseClient
              .from("profiles")
              .update({ birth_FAN: dateValue })
              .eq("id", session.user.id);
            if (error) console.error("Supabase update error:", error);
          }
        } catch (err) {
          console.error("Error saving fan birthday:", err);
        }
      }

      async function confirmFanBirthday(key, label) {
        const input = document.getElementById("fan-birthday-input");
        const dateValue = input ? input.value : "";

        // ลบ UI กรอกวันเกิด
        const promptEl = document.getElementById("fan-birthday-prompt");
        if (promptEl) promptEl.remove();

        if (dateValue) {
          userData.fanBirthdate = dateValue;

          // บันทึกลง Supabase
          await saveFanBirthday(dateValue);

          // แสดงข้อความฝั่ง user
          const d = new Date(dateValue);
          const formatted = d.toLocaleDateString("th-TH", {
            year: "numeric",
            month: "long",
            day: "numeric",
          });
          const personLabel = key === "talking" ? "คนที่คุยด้วย" : "แฟน";
          appendUserMessage(`วันเกิด${personLabel}: <b>${formatted}</b>`);
        } else {
          // ไม่ได้กรอก ให้ข้ามเหมือนกด skip
          skipFanBirthday(key, label);
          return;
        }

        proceedAfterStatus(key, label);
      }

      function skipFanBirthday(key, label) {
        const promptEl = document.getElementById("fan-birthday-prompt");
        if (promptEl) promptEl.remove();
        userData.fanBirthdate = null;
        const personLabel = key === "talking" ? "คนที่คุยด้วย" : "แฟน";
        appendUserMessage(`ไม่ระบุวันเกิด${personLabel}`);
        proceedAfterStatus(key, label);
      }

      // ขั้นตอนต่อจากสถานะ (เดิมอยู่ใน selectStatus)
      async function proceedAfterStatus(key, label) {
        showTyping(true);
        userInput.disabled = true;
        sendBtn.disabled = true;

        try {
          const profile = await getUserProfile();
          const { res, data } = await fetchJsonWithTimeout("/api/v1/horoscope", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              name: profile.nickname || profile.full_name || "ลูกดวง",
              birthdate: profile.birth_date || "2000-01-01",
              birthtime: profile.birth_time || "12:00",
              fan_birthdate: userData.fanBirthdate,
              status: label,
              question: `ช่วยดูภาพรวมความรักเบื้องต้นของฉันในสถานะ "${label}" โดยเน้น ${userData.statusFocus}`,
              category: "LOVE_OVERVIEW",
            }),
          });

          if (!res.ok) {
            throw new Error(data.detail || `Horoscope API returned ${res.status}`);
          }

          showTyping(false);
          chatState = "AWAITING_QUESTION";
          userInput.disabled = false;
          sendBtn.disabled = false;
          userInput.placeholder =
            "พิมพ์เรื่องที่อยากรู้ (เช่น เขาคิดยังไง, เมื่อไหร่จะมีแฟน)...";
          userInput.focus();
          appendAIMessage(data.prediction);
        } catch (err) {
          showTyping(false);
          chatState = "AWAITING_QUESTION";
          userInput.disabled = false;
          sendBtn.disabled = false;
          userInput.placeholder =
            "พิมพ์เรื่องที่อยากรู้ (เช่น เขาคิดยังไง, เมื่อไหร่จะมีแฟน)...";
          userInput.focus();
          appendAIMessage(
            "แม่หมอเชื่อมต่อพลังงานไม่ได้ตอนนี้ แต่พิมพ์คำถามที่อยู่ในใจมาได้เลยนะคะ",
          );
          console.error(err);
        }
      }

      // ─────────────────────────────────────────────────────────────
      // 1. ผู้ใช้กดเลือกสถานะ
      // ─────────────────────────────────────────────────────────────
      function selectStatus(key, label, focus) {
        if (chatState !== "AWAITING_STATUS") return;

        userData.statusKey = key;
        userData.statusLabel = label;
        userData.statusFocus = focus;

        // 🌟 เปลี่ยนสีธีมทั้งหน้าเว็บไซต์
        document.body.className = `bg-[#050305] text-slate-200 h-screen flex flex-col overflow-hidden relative selection:bg-[rgb(var(--c-primary)/0.3)] theme-${key}`;

        // ซ่อนปุ่มเลือกสถานะ
        document.getElementById("status-selection").style.display = "none";

        appendUserMessage(`สถานะตอนนี้: <b>${label}</b>`);

        // ─── ถ้าเป็น talking หรือ couple → ถามวันเกิดแฟน/คนคุยก่อน ───
        if (key === "talking" || key === "couple") {
          chatState = "AWAITING_FAN_BIRTHDAY";
          setTimeout(() => {
            appendFanBirthdayPrompt(key, label);
          }, 600);
        } else {
          // single / broken → ข้ามขั้นตอนวันเกิดแฟน ไปเลย
          proceedAfterStatus(key, label);
        }
      }

      //////////////////////////////////////////////////////////////
      async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendUserMessage(text);
        userInput.value = "";

        if (chatState === "AWAITING_QUESTION" || chatState === "CHATTING") {
          userData.question = text;
          showTyping(true);
          userInput.disabled = true;

          const profile = await getUserProfile();

          try {
            // เรียกผ่าน Node gateway เพื่อให้ frontend ไม่ผูกกับ port ของ Python โดยตรง
            const { res, data } = await fetchJsonWithTimeout("/api/v1/horoscope", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                name: profile.nickname || profile.full_name || "ลูกดวง",
                birthdate: profile.birth_date || "2000-01-01",
                birthtime: profile.birth_time || "12:00",
                fan_birthdate: userData.fanBirthdate,
                status: userData.statusLabel,
                question: userData.question,
                category: "LOVE"
              }),
            });

            if (!res.ok) {
              throw new Error(data.detail || `Horoscope API returned ${res.status}`);
            }

            showTyping(false);
            userInput.disabled = false;
            userInput.focus();
            chatState = "CHATTING";

            // ใช้ฟิลด์ prediction จาก FastAPI
            appendAIMessage(data.prediction);
          } catch (err) {
            showTyping(false);
            userInput.disabled = false;
            appendAIMessage(
              "แม่หมอเชื่อมต่อพลังงานไม่ได้ตอนนี้ ลองใหม่อีกครั้งนะคะ ✨",
            );
            console.error(err);
          }
        }
      }
      //////////////////////////////////////////////////////////////

      // --- ระบบ Popup Profile ---
      async function loadProfileForPopup() {
        const checkClient = setInterval(async () => {
          if (typeof supabaseClient !== "undefined" && supabaseClient) {
            clearInterval(checkClient);
            try {
              const {
                data: { session },
              } = await supabaseClient.auth.getSession();
              if (session && session.user) {
                // === อัปเดตข้อมูลใน Popup ===
                const userEmail = session.user.email;
                if (userEmail) {
                  const elEmail = document.getElementById("popup-email");
                  if (elEmail) elEmail.textContent = userEmail;

                  const domain = userEmail.split("@")[1];
                  const elManaged = document.getElementById("popup-managed");
                  if (domain && elManaged) {
                    elManaged.textContent = "Managed by " + domain;
                  }
                }

                const { data: profile } = await supabaseClient
                  .from("profiles")
                  .select("full_name")
                  .eq("id", session.user.id)
                  .single();

                // กำหนดชื่อที่แสดงและตัวอักษรย่อ
                const displayName =
                  profile && profile.full_name
                    ? profile.full_name
                    : userEmail
                      ? userEmail.split("@")[0]
                      : "USER";
                const elGreeting = document.getElementById("popup-greeting");
                if (elGreeting)
                  elGreeting.textContent =
                    "Hi, " + displayName.toUpperCase() + "!";

                const firstLetter = displayName.charAt(0).toUpperCase();
                const elPopupLetter = document.getElementById(
                  "popup-avatar-letter",
                );
                if (elPopupLetter) elPopupLetter.textContent = firstLetter;

                const avatarBtn = document.getElementById("avatar-btn");
                if (avatarBtn) {
                  avatarBtn.innerHTML = `<span class="text-[rgb(var(--c-accent))] font-bold text-lg theme-transition">${firstLetter}</span>`;
                }
              }
            } catch (err) {
              console.error("Error loading profile for popup:", err);
            }
          }
        }, 100);
      }

      // เริ่มดึงข้อมูลโปรไฟล์
      loadProfileForPopup();

      // การเปิด/ปิด Popup
      document.addEventListener("DOMContentLoaded", () => {
        const avatarBtn = document.getElementById("avatar-btn");
        const accountPopup = document.getElementById("account-popup");
        const closePopup = document.getElementById("close-popup");

        if (avatarBtn && accountPopup) {
          avatarBtn.addEventListener("click", () => {
            accountPopup.style.display =
              accountPopup.style.display === "none" ? "block" : "none";
          });

          if (closePopup) {
            closePopup.addEventListener("click", () => {
              accountPopup.style.display = "none";
            });
          }

          // ซ่อนเมื่อคลิกพื้นที่อื่น
          document.addEventListener("click", (e) => {
            if (
              !avatarBtn.contains(e.target) &&
              !accountPopup.contains(e.target)
            ) {
              accountPopup.style.display = "none";
            }
          });
        }
      });
    </script>
  </body>
</html>
