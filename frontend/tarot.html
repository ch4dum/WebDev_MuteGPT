<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ไพ่ยิปซีพยากรณ์ - MuteGPT</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/mobile-chat.css" />
    
    <style>
        /* ธีมสีม่วงลึกลับ (Mystic Purple) */
        :root {
            --c-primary: 168 85 247;   /* purple-500 */
            --c-secondary: 147 51 234; /* purple-600 */
            --c-accent: 216 180 254;   /* purple-300 */
            --c-light: 243 232 255;    /* purple-100 */
            --c-dark: 88 28 135;       /* purple-900 */
        }

        body { font-family: 'Prompt', sans-serif; transition: background-color 0.8s ease; }
        
        /* Scrollbar อิงตามสีธีม */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgb(var(--c-primary)); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgb(var(--c-secondary)); }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }
        .typing-dot { animation: typing 1.2s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-animate { animation: fadeSlideIn 0.35s ease forwards; }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .shimmer-text {
            background: linear-gradient(90deg, #e9d5ff, #a855f7, #7c3aed, #c084fc, #e9d5ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
        }

        .markdown-content p { margin-bottom: 0.75rem; }
        .markdown-content p:last-child { margin-bottom: 0; }
        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3 {
            color: rgb(var(--c-light));
            font-weight: 700;
            line-height: 1.35;
            margin: 0.75rem 0 0.5rem;
        }
        .markdown-content h1 { font-size: 1.25rem; }
        .markdown-content h2 { font-size: 1.15rem; }
        .markdown-content h3 { font-size: 1.05rem; }
        .markdown-content strong {
            color: rgb(var(--c-accent));
            font-weight: 600;
        }
        .markdown-content em { color: rgb(var(--c-light)); }
        .markdown-content ul,
        .markdown-content ol {
            margin-left: 1.5rem;
            margin-bottom: 0.75rem;
        }
        .markdown-content ul { list-style-type: disc; }
        .markdown-content ol { list-style-type: decimal; }
        .markdown-content li { margin-bottom: 0.25rem; }
        .markdown-content blockquote {
            border-left: 3px solid rgb(var(--c-primary));
            padding-left: 0.9rem;
            margin: 0.75rem 0;
            color: rgb(var(--c-light));
            background: rgb(var(--c-dark) / 0.18);
            border-radius: 0.5rem;
        }
        .markdown-content code {
            background: rgb(15 23 42 / 0.75);
            color: rgb(var(--c-light));
            border: 1px solid rgb(var(--c-primary) / 0.2);
            border-radius: 0.35rem;
            padding: 0.1rem 0.35rem;
            font-size: 0.9em;
        }
        .markdown-content hr {
            border: none;
            border-top: 1px solid rgb(var(--c-primary) / 0.25);
            margin: 1rem 0;
        }

        .theme-transition { transition: all 0.8s ease-in-out; }

        /* ---- สไตล์สำหรับไพ่ยิปซี (3D Flip) ---- */
        .tarot-card-container { perspective: 1000px; }
        .tarot-card {
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }
        .tarot-card.flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            overflow: hidden;
        }
        .card-back {
            background: #12051f url("assets/backside_card.jpg") center / cover no-repeat;
            border: 1px solid rgba(168, 85, 247, 0.5);
        }
        .card-front {
            background-color: #0f172a;
            transform: rotateY(180deg);
            border: 2px solid #fbbf24;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
        }
        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #020617;
        }
        
        /* ---------------------------------------------------- */
        /* 1. สไตล์สำหรับการปูไพ่แบบวงกลม (Wheel Spread) */
        /* ---------------------------------------------------- */
        .deck-card-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 35px;
            height: 55px;
            margin-top: -27.5px;
            margin-left: -17.5px;
            transform: rotate(var(--target-angle)) translateY(-130px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s, box-shadow 0.2s;
            transform-origin: center center;
            z-index: 10;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        @media (min-width: 768px) {
            .deck-card-circle {
                width: 50px;
                height: 80px;
                margin-top: -40px;
                margin-left: -25px;
                transform: rotate(var(--target-angle)) translateY(-240px);
            }
        }
        @media (hover: hover) and (pointer: fine) {
            .deck-card-circle:hover {
                transform: rotate(var(--target-angle)) translateY(-165px) scale(1.28);
                box-shadow: 0 0 22px rgba(168, 85, 247, 0.95);
                border-color: #fbbf24;
                z-index: 250 !important;
            }
        }
        @media (min-width: 768px) and (hover: hover) and (pointer: fine) {
            .deck-card-circle:hover {
                transform: rotate(var(--target-angle)) translateY(-285px) scale(1.28);
            }
        }

        /* ---------------------------------------------------- */
        /* 2. สไตล์สำหรับการปูไพ่แบบครึ่งวงกลม (Fan Spread) */
        /* ---------------------------------------------------- */
        .fan-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            overflow: visible;
            margin-top: 10px;
        }
        @media (min-width: 768px) {
            .fan-wrapper { height: 260px; }
        }
        .deck-card-fan {
            position: absolute;
            top: 10px;
            left: 50%;
            width: 40px;
            height: 60px;
            margin-left: -20px;
            transform-origin: center 200px;
            transform: rotate(var(--target-angle));
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
            z-index: 10;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        @media (hover: hover) and (pointer: fine) {
            .deck-card-fan:hover {
                transform: rotate(var(--target-angle)) translateY(-24px) scale(1.16);
                box-shadow: 0 0 22px rgba(168, 85, 247, 0.95);
                border-color: #fbbf24;
                z-index: 250 !important;
            }
        }
        @media (min-width: 768px) {
            .deck-card-fan {
                top: 20px;
                width: 55px;
                height: 85px;
                margin-left: -27.5px;
                transform-origin: center 300px;
            }
        }
        @media (min-width: 768px) and (hover: hover) and (pointer: fine) {
            .deck-card-fan:hover {
                transform: rotate(var(--target-angle)) translateY(-36px) scale(1.16);
            }
        }

        .deck-card-circle.is-picked,
        .deck-card-fan.is-picked {
            opacity: 0;
            pointer-events: none;
        }

        .deck-card-circle.is-preview {
            transform: rotate(var(--target-angle)) translateY(-148px) scale(1.16);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.8);
            border-color: #fbbf24;
            z-index: 260 !important;
        }

        .deck-card-fan.is-preview {
            transform: rotate(var(--target-angle)) translateY(-22px) scale(1.12);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.8);
            border-color: #fbbf24;
            z-index: 260 !important;
        }

        .tarot-center-controls {
            z-index: 300 !important;
        }

        @media (max-width: 767px) {
            .tarot-wheel-shell {
                overflow-x: clip;
            }

            .tarot-wheel-deck {
                width: min(260px, calc(100vw - 7rem), 100%) !important;
                height: auto !important;
                aspect-ratio: 1 / 1;
                margin-left: auto;
                margin-right: auto;
            }

            .deck-card-circle {
                width: 30px;
                height: 48px;
                margin-top: -24px;
                margin-left: -15px;
                transform: rotate(var(--target-angle)) translateY(-100px);
            }

            .deck-card-circle.is-preview {
                transform: rotate(var(--target-angle)) translateY(-114px) scale(1.14);
            }

            .fan-wrapper {
                width: min(300px, calc(100vw - 3.5rem));
                height: 155px;
                margin-left: auto;
                margin-right: auto;
                overflow: visible;
            }

            .deck-card-fan {
                width: 34px;
                height: 52px;
                margin-left: -17px;
                transform-origin: center 165px;
            }

            .deck-card-fan.is-preview {
                transform: rotate(var(--target-angle)) translateY(-18px) scale(1.1);
            }
        }
    </style>
</head>
<body class="chat-shell bg-[#05030a] text-slate-200 h-screen flex flex-col overflow-hidden relative">

    <!-- --- BACKGROUND (ใช้ background.jpg เหมือนหน้าอื่นๆ) --- -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden" style="
        background:
          linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
          url(&quot;assets/background.jpg&quot;) no-repeat center center fixed;
        background-size: cover;
      ">
        <div
            class="absolute top-[-20%] left-[-10%] w-[70%] h-[70%] bg-red-950/20 rounded-full blur-[150px] mix-blend-screen">
        </div>
        <div
            class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] bg-rose-900/15 rounded-full blur-[120px] mix-blend-screen">
        </div>
        <div class="absolute inset-0 opacity-[0.03]" style="
          background-image: radial-gradient(
            circle at center,
            #ffffff 1px,
            transparent 1px
          );
          background-size: 30px 30px;
        "></div>
        <div
            class="absolute top-[-20%] left-[-10%] w-[70%] h-[70%] bg-[rgb(var(--c-dark)/0.4)] rounded-full blur-[150px] mix-blend-screen theme-transition">
        </div>
        <div
            class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] bg-[rgb(var(--c-secondary)/0.2)] rounded-full blur-[120px] mix-blend-screen theme-transition">
        </div>
        <div
            class="absolute top-[20%] left-[50%] translate-x-[-50%] w-[80%] h-[50%] bg-[rgb(var(--c-primary)/0.1)] rounded-full blur-[180px] mix-blend-screen theme-transition">
        </div>
    </div>

    <!-- NAVBAR -->
    <nav class="relative z-20 w-full bg-[#05030a]/80 backdrop-blur-md border-b border-[rgb(var(--c-primary)/0.2)] py-3 shadow-[0_4px_30px_rgba(0,0,0,0.5)] shrink-0 theme-transition">
        <div class="container mx-auto px-4 flex justify-between items-center gap-3 max-w-4xl">
            <div class="flex items-center gap-3 min-w-0 flex-1">
                <button id="back-btn" type="button" onclick="handleBackNavigation()" class="w-9 h-9 shrink-0 rounded-full hover:bg-white/10 text-slate-400 hover:text-purple-300 transition-colors flex items-center justify-center">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-10 h-10 shrink-0 rounded-full bg-[rgb(var(--c-dark)/0.5)] border border-[rgb(var(--c-primary)/0.3)] flex items-center justify-center shadow-inner theme-transition">
                        <i data-lucide="layers" class="w-5 h-5 text-[rgb(var(--c-accent))] theme-transition"></i>
                    </div>
                    <div class="min-w-0">
                        <h1 class="text-lg sm:text-xl font-bold text-white leading-none tracking-wide shimmer-text truncate">Tarot Reading 🔮</h1>
                        <p class="text-[11px] text-[rgb(var(--c-light))] mt-1 theme-transition truncate">ให้หน้าไพ่เปิดเผยโชคชะตาของคุณ</p>
                    </div>
                </div>
            </div>
            <!-- ปุ่มโปรไฟล์ + Account Popup -->
            <div class="flex items-center gap-3 relative">
                <div id="avatar-btn"
                    class="w-10 h-10 rounded-full flex items-center justify-center border cursor-pointer hover:scale-105 transition-all bg-[rgb(var(--c-dark)/0.5)] border-[rgb(var(--c-primary)/0.3)] shadow-[0_0_15px_rgb(var(--c-primary)/0.2)] theme-transition">
                    <i data-lucide="user" class="w-5 h-5 text-[rgb(var(--c-accent))] theme-transition"></i>
                </div>
                <!-- Account Popup -->
                <div id="account-popup"
                    class="absolute top-[calc(100%+10px)] right-0 bg-[#0a0514]/95 backdrop-blur-xl rounded-3xl w-[340px] shadow-[0_10px_40px_rgba(0,0,0,0.8),0_0_20px_rgb(var(--c-primary)/0.2)] border border-[rgb(var(--c-primary)/0.3)] z-[100] overflow-hidden theme-transition"
                    style="display: none;">
                    <div class="p-6 text-center relative">
                        <button id="close-popup"
                            class="absolute top-4 right-4 bg-transparent border-none text-slate-400 hover:text-[rgb(var(--c-accent))] cursor-pointer transition-colors theme-transition">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                        <div id="popup-email" class="text-slate-50 text-[0.95rem] font-medium mb-1 break-all">loading...</div>
                        <div id="popup-managed" class="text-slate-400 text-xs mb-6"></div>
                        <div id="popup-avatar-large"
                            class="w-20 h-20 rounded-full bg-gradient-to-br from-[rgb(var(--c-dark)/0.8)] to-[rgb(var(--c-primary)/0.5)] border border-[rgb(var(--c-accent)/0.4)] text-[rgb(var(--c-light))] flex items-center justify-center text-4xl mx-auto mb-4 relative shadow-[0_0_15px_rgb(var(--c-primary)/0.4)] theme-transition">
                            <span id="popup-avatar-letter"></span>
                            <div class="absolute -bottom-0.5 -right-0.5 bg-[#0a0514] border border-[rgb(var(--c-primary)/0.5)] rounded-full p-1.5 flex theme-transition">
                                <i data-lucide="camera" class="w-3.5 h-3.5 text-[rgb(var(--c-light))] theme-transition"></i>
                            </div>
                        </div>
                        <div id="popup-greeting"
                            class="bg-gradient-to-r from-[rgb(var(--c-light))] to-[rgb(var(--c-accent))] bg-clip-text text-transparent text-xl font-bold mb-6 theme-transition">
                            Hi!</div>
                        <button onclick="handleLogout()"
                            class="bg-gradient-to-r from-red-500 to-red-800 text-white py-2 px-5 rounded-full border-none text-sm font-semibold cursor-pointer transition-all shadow-[0_0_15px_rgba(239,68,68,0.4)] hover:shadow-[0_0_25px_rgba(239,68,68,0.6)] hover:-translate-y-[1px] inline-flex items-center justify-center gap-2">
                            <i data-lucide="log-out" class="w-4 h-4"></i>
                            ออกจากระบบ
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- CHAT AREA -->
    <main class="relative z-10 flex-1 w-full max-w-4xl mx-auto flex flex-col min-h-0 bg-[#0a0512]/50 backdrop-blur-sm border-x border-white/5 shadow-2xl">
        
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 scroll-smooth">
            
            <!-- ข้อความต้อนรับ -->
            <div class="flex gap-3 msg-animate" data-persistent="true">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-[rgb(var(--c-primary))] to-[rgb(var(--c-dark))] border border-[rgb(var(--c-accent))] flex items-center justify-center shrink-0 shadow-[0_0_15px_rgb(var(--c-primary)/0.35)] mt-1 theme-transition">
                    <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
                </div>
                <div class="flex flex-col gap-1 max-w-[85%] md:max-w-[75%] w-full">
                    <span class="text-xs text-[rgb(var(--c-light))] ml-1 theme-transition">แม่หมอไพ่ยิปซี AI</span>
                    <div class="bg-[#1a0f2e]/90 p-4 rounded-2xl rounded-tl-sm border border-[rgb(var(--c-primary)/0.3)] text-slate-200 text-sm md:text-base leading-relaxed shadow-lg theme-transition">
                        ยินดีต้อนรับเข้าสู่มิติแห่งไพ่ยิปซีค่ะ ✨<br><br>
                        เพื่อให้ไพ่สะท้อนพลังงานและให้คำตอบที่ตรงจุดที่สุด <b>กรุณาเลือก "หมวดหมู่" ที่คุณต้องการให้ไพ่สื่อถึงในวันนี้ค่ะ</b>
                    </div>
                </div>
            </div>

            <!-- ตัวเลือกหมวดหมู่ 7 โหมด -->
            <div id="category-selection" class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4 pl-14 pr-4 msg-animate" style="animation-delay: 0.4s;">
                
                <!-- โหมด 3 สถานการณ์ -->
                <button onclick="selectCategory('three_situations', 'การอ่านไพ่ 3 สถานการณ์', 'ดูเส้นทางชีวิต การแก้ไขปัญหา การตัดสินใจ')" class="relative cat-card w-full md:col-span-2 text-left p-4 rounded-xl border border-amber-400/30 bg-gradient-to-r from-amber-950/30 to-purple-950/20 hover:from-amber-900/40 hover:to-purple-900/30 flex items-center gap-4 group shadow-md mt-1 mb-1">
                    <div class="absolute -top-2.5 right-4 bg-gradient-to-r from-amber-400 to-orange-500 text-slate-900 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1 shadow-md">
                        <i data-lucide="sparkles" class="w-3 h-3"></i> แนะนำ
                    </div>
                    <div class="w-10 h-10 rounded-full bg-amber-400/20 border border-amber-400/30 flex items-center justify-center group-hover:scale-110 transition-transform shrink-0">
                        <i data-lucide="layers" class="w-5 h-5 text-amber-300"></i>
                    </div>
                    <div class="flex-1">
                        <div class="font-bold text-amber-200">การอ่านไพ่ 3 สถานการณ์</div>
                        <div class="text-xs text-slate-400 mt-0.5">
                            ครอบคลุมการดูเส้นทางชีวิต, การแก้ไขปัญหา, หรือการตัดสินใจ
                        </div>
                    </div>
                </button>

                <!-- แถวที่ 1 (Daily & Love) -->
                <button onclick="selectCategory('daily', 'ดวงรายวัน', 'ทำนายเรื่องสำคัญ ดูดวงวันนี้')" class="cat-card w-full text-left p-4 rounded-xl border border-purple-500/30 bg-purple-950/25 hover:bg-purple-900/35 flex items-center gap-4 group shadow-md">
                    <div class="w-10 h-10 rounded-full bg-purple-500/20 border border-purple-500/30 flex items-center justify-center group-hover:scale-110 transition-transform shrink-0">
                        <i data-lucide="sun" class="w-5 h-5 text-purple-400"></i>
                    </div>
                    <div>
                        <div class="font-bold text-purple-200">ดวงรายวัน</div>
                        <div class="text-xs text-slate-400 mt-0.5">ทำนายเรื่องสำคัญ ดูดวงวันนี้</div>
                    </div>
                </button>

                <button onclick="selectCategory('love', 'ดวงความรัก', 'ความรัก คู่ครอง ปัญหา ทางออก')" class="cat-card w-full text-left p-4 rounded-xl border border-violet-400/30 bg-violet-950/20 hover:bg-violet-900/30 flex items-center gap-4 group shadow-md">
                    <div class="w-10 h-10 rounded-full bg-violet-400/20 border border-violet-400/30 flex items-center justify-center group-hover:scale-110 transition-transform shrink-0">
                        <i data-lucide="heart" class="w-5 h-5 text-violet-300"></i>
                    </div>
                    <div>
                        <div class="font-bold text-violet-200">ดวงความรัก</div>
                        <div class="text-xs text-slate-400 mt-0.5">ความรัก คู่ครอง ปัญหา ทางออก</div>
                    </div>
                </button>

                <!-- แถวที่ 2 (Work & Finance) -->
                <button onclick="selectCategory('work', 'ดวงการงาน อาชีพ', 'ปัญหา อุปสรรค โอกาส ทางแก้')" class="cat-card w-full text-left p-4 rounded-xl border border-fuchsia-500/30 bg-fuchsia-950/20 hover:bg-fuchsia-900/30 flex items-center gap-4 group shadow-md">
                    <div class="w-10 h-10 rounded-full bg-fuchsia-500/20 border border-fuchsia-500/30 flex items-center justify-center group-hover:scale-110 transition-transform shrink-0">
                        <i data-lucide="briefcase" class="w-5 h-5 text-fuchsia-400"></i>
                    </div>
                    <div>
                        <div class="font-bold text-fuchsia-200">ดวงการงาน อาชีพ</div>
                        <div class="text-xs text-slate-400 mt-0.5">ปัญหา อุปสรรค โอกาส ทางแก้</div>
                    </div>
                </button>

        // สถานะการแชท

        const suits = ["Wands", "Cups", "Swords", "Pentacles"];
        const suitFolders = {"Wands": "Wands", "Cups": "Cups", "Swords": "Swords", "Pentacles": "Pentacles"};

            "6": "six",

            "8": "eight",
            "9": "nine",
            "10": "ten",
            "Page": "page",
            "Knight": "knight",
            "Queen": "queen",
            "King": "king",

        // วนลูปสร้างไพ่ Minor Arcana 
        suits.forEach(suit => {

                            : suit === 'Cups' ? 'อารมณ์ ความสัมพันธ์ และความรัก' 
                            : suit === 'Swords' ? 'สติปัญญา ปัญหา และการตัดสินใจ'

                const fileName = `${rankFileNames[rank]}-of-${suit.toLowerCase()}.png`;
                allTarotDeck.push({
                    id: cardIdCount++,
                    name: `${rank} of ${suit}`,
                    type: suit.toLowerCase(),
                    imgUrl: `${tarotAssetBase}/Minor_arcana/${suitFolders[suit]}/${fileName}`,
                    meaning: `ไพ่ชุดรอง (Minor Arcana) สื่อถึง${suitMeaning}`
                });
            });
        });

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');
        let currentUser = null;
        let currentProfile = {};

        function scrollToBottom() {
            setTimeout(() => { chatMessages.scrollTop = chatMessages.scrollHeight; }, 100);
        }

        function showTyping(show) {
            if (show) { typingIndicator.classList.remove('hidden'); scrollToBottom(); }
            else { typingIndicator.classList.add('hidden'); }
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getUserInitial() {
            const displayName =
                currentProfile.full_name ||
                currentProfile.nickname ||
                currentUser?.email?.split('@')[0] ||
                document.querySelector('#avatar-btn span')?.textContent?.trim() ||
                'U';
            return displayName.trim().charAt(0).toUpperCase();
        }

        function handleBackNavigation() {
            if (chatState !== 'AWAITING_CATEGORY') {
                resetToCategorySelection();
                return;
            }
            window.location.href = 'main.html';
        }

        function resetToCategorySelection() {
            chatState = 'AWAITING_CATEGORY';
            currentTarotSessionId = null;
            selectedCardsData = [];
            availableDeck = [];
            isSelectingCard = false;
            previewCardElement = null;
            userData = {
                categoryKey: '',
                categoryName: '',
                categoryDesc: '',
                subCategoryKey: '',
                subCategoryName: '',
                question: '',
                spreadType: 'fan1',
            };

            Array.from(chatMessages.children).forEach(child => {
                if (child.id !== 'category-selection' && child.dataset.persistent !== 'true') {
                    child.remove();
                }
            });

            const categorySelection = document.getElementById('category-selection');
            if (categorySelection) categorySelection.style.display = '';
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            userInput.placeholder = 'กรุณาเลือกหมวดหมู่การทำนายด้านบนก่อนนะคะ...';
            showTyping(false);
            scrollToBottom();
        }

        function buildThreeSituationOptions() {
            return `
                <div class="mt-3 grid grid-cols-1 gap-2">
                    <button onclick="window.selectSubCategory(this, 'life_path', 'ดูเส้นทางชีวิต')" class="w-full text-left px-3.5 py-2.5 rounded-lg border border-purple-500/25 bg-purple-900/15 hover:bg-purple-800/30 transition-colors shadow-sm group">
                        <span class="block font-semibold text-amber-200 group-hover:text-amber-100 text-[15px] leading-tight">🌌 ดูเส้นทางชีวิต</span>
                        <span class="block text-xs text-purple-300/70 mt-1 leading-tight">อดีต, ปัจจุบัน และอนาคต</span>
                    </button>
                    <button onclick="window.selectSubCategory(this, 'problem_solving', 'การแก้ไขปัญหา')" class="w-full text-left px-3.5 py-2.5 rounded-lg border border-purple-500/25 bg-purple-900/15 hover:bg-purple-800/30 transition-colors shadow-sm group">
                        <span class="block font-semibold text-amber-200 group-hover:text-amber-100 text-[15px] leading-tight">🧩 การแก้ไขปัญหา</span>
                        <span class="block text-xs text-purple-300/70 mt-1 leading-tight">สาเหตุ, วิธีแก้ และผลลัพธ์</span>
                    </button>
                    <button onclick="window.selectSubCategory(this, 'decision_making', 'การตัดสินใจ')" class="w-full text-left px-3.5 py-2.5 rounded-lg border border-purple-500/25 bg-purple-900/15 hover:bg-purple-800/30 transition-colors shadow-sm group">
                        <span class="block font-semibold text-amber-200 group-hover:text-amber-100 text-[15px] leading-tight">⚖️ การตัดสินใจ</span>
                        <span class="block text-xs text-purple-300/70 mt-1 leading-tight">ทางเลือก A, ทางเลือก B และคำแนะนำ</span>
                    </button>
                </div>
            `;
        }

        function appendUserMessage(text) {
            const userInitial = escapeHtml(getUserInitial());
            chatMessages.insertAdjacentHTML('beforeend', `
              <div class="flex gap-3 justify-end msg-animate">
                <div class="flex flex-col gap-1 max-w-[85%] md:max-w-[75%] items-end">
                  <div class="bg-gradient-to-br from-[rgb(var(--c-primary))] to-[rgb(var(--c-secondary))] p-4 rounded-2xl rounded-tr-sm text-white text-sm md:text-base leading-relaxed shadow-lg">
                    ${text}
                  </div>
                </div>
                <div class="w-10 h-10 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center shrink-0 overflow-hidden">
                  <span class="text-[rgb(var(--c-light))] font-bold">${userInitial}</span>
                </div>
              </div>`);
            scrollToBottom();
        }

        function appendAIMessage(text, customContent = '', options = {}) {
            const shouldParseMarkdown = options.parseMarkdown !== false;
            const htmlContent = shouldParseMarkdown && window.marked ? marked.parse(String(text || '')) : String(text || '');
            chatMessages.insertAdjacentHTML('beforeend', `
              <div class="flex gap-3 msg-animate w-full">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-[rgb(var(--c-primary))] to-[rgb(var(--c-dark))] border border-[rgb(var(--c-accent))] flex items-center justify-center shrink-0 shadow-[0_0_15px_rgb(var(--c-primary)/0.3)] mt-1 theme-transition">
                  <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
                </div>
                <div class="flex flex-col gap-1 max-w-[85%] md:max-w-[75%] w-full">
                  <span class="text-xs text-[rgb(var(--c-light))] ml-1 theme-transition">แม่หมอไพ่ยิปซี AI</span>
                  <div class="bg-[#1a0f2e]/90 p-4 rounded-2xl rounded-tl-sm border border-[rgb(var(--c-primary)/0.3)] text-slate-200 text-sm md:text-base leading-relaxed shadow-lg overflow-hidden w-full markdown-content theme-transition">
                    ${htmlContent}
                    ${customContent}
                  </div>
                </div>
              </div>`);
            lucide.createIcons();
            scrollToBottom();
        }

        async function getUserContext() {
            try {
                const waitForClient = async () => {
                    for (let i = 0; i < 30; i++) {
                        if (typeof supabaseClient !== 'undefined' && supabaseClient) return supabaseClient;
                        await new Promise(resolve => setTimeout(resolve, 100));
                    }
                    return null;
                };
                const client = await waitForClient();
                if (!client) return { user: null, profile: {} };

                const { data: { session } } = await client.auth.getSession();
                if (!session?.user) return { user: null, profile: {} };

                const { data: profileData } = await client
                    .from('profiles')
                    .select('*')
                    .eq('id', session.user.id)
                    .single();

                currentUser = session.user;
                currentProfile = profileData || {};
                return { user: currentUser, profile: currentProfile };
            } catch (err) {
                console.error('Unable to load user context:', err);
                return { user: null, profile: {} };
            }
        }

        function isMissingTarotTableError(error) {
            const message = `${error?.code || ""} ${error?.message || ""} ${error?.details || ""}`;
            return message.includes('42P01') || message.includes('tarot_sessions') || message.includes('tarot_messages') || message.includes('tarot_readings');
        }

        function showTarotSetupWarning(error) {
            if (hasShownTarotSetupWarning || !isMissingTarotTableError(error)) return;
            hasShownTarotSetupWarning = true;
            appendAIMessage('ระบบประวัติไพ่ยิปซียังไม่พร้อมใช้งาน เพราะยังไม่ได้สร้างตาราง Tarot ใน Supabase ตอนนี้ยังทำนายได้ตามปกติ แต่ประวัติจะยังไม่ถูกบันทึกจนกว่าจะรันไฟล์ `supabase/tarot_schema.sql` ใน Supabase SQL Editor');
        }

        function truncateText(value, maxLength) {
            const compact = String(value || 'ไม่มีคำถาม').replace(/\s+/g, ' ').trim();
            return `${compact.slice(0, maxLength)}${compact.length > maxLength ? '...' : ''}`;
        }

        function buildTarotSessionTitle(question, cards = []) {
            const questionTitle = truncateText(question || 'ไม่มีคำถาม', 42);
            const cardNames = (cards || [])
                .map(card => card?.name)
                .filter(Boolean);

            if (cardNames.length === 0) return questionTitle;

            const cardsTitle = truncateText(cardNames.join(', '), 58);
            return `${questionTitle} | ไพ่: ${cardsTitle}`;
        }

        function getCardsPayload(cards) {
            const labels = cards.length === 3 ? getSlotLabels() : ['ไพ่ที่เลือก'];
            return cards.map((card, idx) => ({
                name: card.name,
                type: card.type,
                meaning: card.meaning,
                imgUrl: card.imgUrl,
                position: labels[idx] || `ใบที่ ${idx + 1}`,
            }));
        }

        async function createTarotSession(question) {
            const { user } = await getUserContext();
            if (!user) return null;

            const { data, error } = await supabaseClient
                .from('tarot_sessions')
                .insert({
                    user_id: user.id,
                    category: userData.categoryKey,
                    category_label: userData.categoryName,
                    subcategory: userData.subCategoryKey || null,
                    subcategory_label: userData.subCategoryName || null,
                    spread_type: userData.spreadType,
                    question_input: question,
                    title: buildTarotSessionTitle(question),
                })
                .select('id')
                .single();

            if (error) {
                showTarotSetupWarning(error);
                throw error;
            }

            currentTarotSessionId = data.id;
            return data.id;
        }

        async function saveTarotMessage(role, content) {
            if (!currentTarotSessionId || !currentUser?.id || !content) return;

            const { error } = await supabaseClient
                .from('tarot_messages')
                .insert({
                    session_id: currentTarotSessionId,
                    user_id: currentUser.id,
                    role,
                    content,
                });

            if (error) {
                showTarotSetupWarning(error);
                console.error('Unable to save tarot message:', error);
            }
        }

        async function saveTarotReading(cards, prediction) {
            if (!currentTarotSessionId || !currentUser?.id || !prediction) return;

            const { error } = await supabaseClient
                .from('tarot_readings')
                .insert({
                    session_id: currentTarotSessionId,
                    user_id: currentUser.id,
                    category: userData.categoryKey,
                    subcategory: userData.subCategoryKey || null,
                    spread_type: userData.spreadType,
                    question_input: userData.question || 'ไม่มี',
                    cards: getCardsPayload(cards),
                    prediction,
                });

            if (error) {
                showTarotSetupWarning(error);
                console.error('Unable to save tarot reading:', error);
            }
        }

        async function updateTarotSessionTitle(cards) {
            if (!currentTarotSessionId || !currentUser?.id) return;

            const { error } = await supabaseClient
                .from('tarot_sessions')
                .update({
                    title: buildTarotSessionTitle(userData.question || 'ไม่มี', cards),
                    updated_at: new Date().toISOString(),
                })
                .eq('id', currentTarotSessionId);

            if (error) {
                showTarotSetupWarning(error);
                console.error('Unable to update tarot session title:', error);
            }
        }

        async function touchTarotSession() {
            if (!currentTarotSessionId) return;
            const { error } = await supabaseClient
                .from('tarot_sessions')
                .update({ updated_at: new Date().toISOString() })
                .eq('id', currentTarotSessionId);

            if (error) {
                showTarotSetupWarning(error);
                console.error('Unable to update tarot session:', error);
            }
        }

        async function requestTarotReading(question, cards, mode = 'TAROT_READING') {
            const { profile } = await getUserContext();
            const { data: { session } } = await supabaseClient.auth.getSession();
            const res = await fetch('/api/v1/tarot-reading', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...(session?.access_token ? { Authorization: `Bearer ${session.access_token}` } : {})
                },
                body: JSON.stringify({
                    name: profile.nickname || profile.full_name || 'ผู้ใช้',
                    full_name: profile.full_name || '',
                    nickname: profile.nickname || '',
                    birthdate: profile.birth_date || '',
                    category: userData.categoryKey,
                    category_label: userData.categoryName,
                    subcategory: userData.subCategoryKey || '',
                    subcategory_label: userData.subCategoryName || '',
                    spread_type: userData.spreadType,
                    question,
                    cards: getCardsPayload(cards),
                    mode,
                })
            });

            const contentType = res.headers.get('content-type') || '';
            const data = contentType.includes('application/json')
                ? await res.json()
                : { detail: await res.text() };

            if (!res.ok) {
                const error = new Error(data.detail || `API error ${res.status}`);
                error.status = res.status;
                throw error;
            }
            return data;
        }

        function getReadingErrorMessage(err, fallback) {
            const message = err?.message || '';
            if (err?.status === 401 || message.includes('sign in') || message.includes('login session')) {
                return 'กรุณาเข้าสู่ระบบก่อนเริ่มดูดวงนะคะ';
            }
            if (err?.status === 429) return message;
            return fallback;
        }

        async function loadCategoryHistory(categoryKey) {
            const { user } = await getUserContext();
            if (!user) return;

            const { data, error } = await supabaseClient
                .from('tarot_sessions')
                .select('id, category, category_label, subcategory, subcategory_label, spread_type, question_input, title, updated_at')
                .eq('user_id', user.id)
                .eq('category', categoryKey)
                .order('updated_at', { ascending: false })
                .limit(5);

            if (error) {
                showTarotSetupWarning(error);
                console.error('Unable to load tarot history:', error);
                return;
            }

            const previousSessions = (data || []).filter((session) => session.id !== currentTarotSessionId);
            appendTarotHistoryMessage(previousSessions);
        }

        async function loadTarotSession(sessionId) {
            const session = tarotHistoryCache.get(sessionId);
            if (!session) return;

            userData.categoryKey = session.category;
            userData.categoryName = session.category_label;
            userData.subCategoryKey = session.subcategory || '';
            userData.subCategoryName = session.subcategory_label || '';
            userData.spreadType = session.spread_type;
            userData.question = session.question_input;
            currentTarotSessionId = session.id;
            chatState = 'READING_COMPLETE';

            document.getElementById('category-selection').style.display = 'none';
            document.getElementById('tarot-history-panel')?.remove();
            userInput.disabled = true;
            sendBtn.disabled = true;
            userInput.placeholder = 'เลือกถามเพิ่มจากไพ่เดิม หรือเปิดไพ่ใหม่ได้เลย...';

            appendAIMessage(`โหลดประวัติ **${escapeHtml(session.title)}** แล้ว`);

            const { data, error } = await supabaseClient
                .from('tarot_messages')
                .select('role, content, created_at')
                .eq('session_id', sessionId)
                .order('created_at', { ascending: true });

            if (error) {
                showTarotSetupWarning(error);
                console.error('Unable to load tarot messages:', error);
                return;
            }

            (data || []).forEach((message) => {
                if (message.role === 'user') appendUserMessage(escapeHtml(message.content));
                else appendAIMessage(message.content);
            });

            const { data: readings, error: readingsError } = await supabaseClient
                .from('tarot_readings')
                .select('cards')
                .eq('session_id', sessionId)
                .order('created_at', { ascending: false })
                .limit(1);

            if (readingsError) {
                showTarotSetupWarning(readingsError);
                console.error('Unable to load tarot reading cards:', readingsError);
            } else {
                selectedCardsData = (readings?.[0]?.cards || []).map(card => ({
                    name: card.name,
                    type: card.type || '',
                    meaning: card.meaning || '',
                    imgUrl: card.imgUrl || '',
                }));
            }

            appendFollowUpOptions();
        }

        async function deleteTarotSession(event, sessionId) {
            event?.stopPropagation();

            const session = tarotHistoryCache.get(sessionId);
            const label = session?.title || 'ประวัตินี้';
            const confirmed = window.confirm(`ลบ "${label}" และข้อความทั้งหมดในประวัตินี้ใช่ไหม?`);
            if (!confirmed) return;

            const { error } = await supabaseClient
                .from('tarot_sessions')
                .delete()
                .eq('id', sessionId);

            if (error) {
                showTarotSetupWarning(error);
                appendAIMessage('ลบประวัติไม่สำเร็จ กรุณาลองใหม่อีกครั้ง');
                console.error('Unable to delete tarot session:', error);
                return;
            }

            tarotHistoryCache.delete(sessionId);
            document.getElementById(`tarot-history-session-${sessionId}`)?.remove();

            if (currentTarotSessionId === sessionId) {
                currentTarotSessionId = null;
                chatState = 'AWAITING_CATEGORY';
            }

            appendAIMessage(`ลบประวัติ **${escapeHtml(label)}** แล้ว`);
        }

        // 2. พิมพ์คำถาม แล้วแสดงวงล้อ/พัดไพ่
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendUserMessage(text);
            userInput.value = '';

            // ถ้ารอรับคำถาม ให้เข้ากระบวนการเปิดไพ่
            if (chatState === 'AWAITING_QUESTION') {
                userData.question = text;
                promptCardSelection();
            } 
            // ถ้าอยู่ในโหมดถามเพิ่มเติมจากไพ่เดิม
            else if (chatState === 'FOLLOW_UP_QUESTION') {
                showTyping(true);
                userInput.disabled = true;
                sendBtn.disabled = true;

                await saveTarotMessage('user', text);

                try {
                    const data = await requestTarotReading(text, selectedCardsData, 'TAROT_FOLLOWUP');
                    const reply = data.prediction || data.result || data.message;
                    showTyping(false);
                    userInput.disabled = false;
                    sendBtn.disabled = false;
                    userInput.focus();
                    appendAIMessage(reply);
                    await saveTarotMessage('assistant', reply);
                    await touchTarotSession();
                } catch (err) {
                    showTyping(false);
                    userInput.disabled = false;
                    sendBtn.disabled = false;
                    userInput.focus();
                    appendAIMessage(getReadingErrorMessage(err, 'ขออภัยค่ะ ระบบอ่านไพ่กำลังมีปัญหา กรุณาลองใหม่อีกครั้ง'));
                    console.error(err);
                }
            }
            // ถ้าอ่านคำทำนายจบแล้ว แต่ผู้ใช้พิมพ์มาเอง (ถึงจะปิด input ไว้แล้วก็ตาม เผื่อหลุดมา)
            else if (chatState === 'READING_COMPLETE') {
                showTyping(true);
                setTimeout(() => {
                    showTyping(false);
                    appendAIMessage("หากต้องการตั้งคำถามใหม่ กรุณากดเลือกปุ่มตัวเลือกที่อยู่ด้านบนนะคะ ✨");
                }, 1000);
            }
        }

        // 3. กางไพ่ (แยกแบบ 3 ใบ 78 ใบ หรือ 1 ใบ 22 ใบ หรือ 1 ใบ 78 ใบ ตามหมวดที่เลือก)

        // ==========================================
        // ฟังก์ชันสำหรับวงล้อ (Wheel Spread - 78 ใบ)
        // ==========================================
        window.bringDeckCardToFront = function(element) {
            if (!element) return;
            element.dataset.zIndex = element.dataset.zIndex || element.style.zIndex || '10';
            element.style.setProperty('z-index', '2147483647', 'important');
        };

        window.restoreDeckCardLayer = function(element) {
            if (!element) return;
            if (element.classList.contains('is-preview')) return;
            element.style.zIndex = element.dataset.zIndex || '10';
        };

        window.renderWheelSpread = function(animateFromCenter = false) {
            const container = document.getElementById('deck-container');
            if (!container) return;
            previewCardElement = null;
            
            let html = '';
            let validCards = [];
            
            // หาไพ่ที่ยังไม่ได้ถูกดึงไป
            for(let i=0; i<availableDeck.length; i++) {
                if(availableDeck[i]) validCards.push(i);
            }
            
            const total = validCards.length;
            const isThree = userData.spreadType === 'wheel3';
            
            validCards.forEach((originalIndex, idx) => {
                const angle = (360 / total) * idx;
                const inlineTransform = animateFromCenter ? 'transform: rotate(0deg) translateY(0px) translateX(0px);' : '';
                
                html += `
                    <div class="deck-card-circle cursor-pointer rounded border border-purple-400/50 card-back shadow-md" 
                         style="--target-angle: ${angle}deg; z-index: ${idx}; ${inlineTransform}" 
                         data-index="${originalIndex}" 
                         data-z-index="${idx}"
                         onmouseenter="window.bringDeckCardToFront(this)"
                         onmouseleave="window.restoreDeckCardLayer(this)"
                         onclick="window.selectFromDeck(this)">
                    </div>
                `;
            });

            // สร้างปุ่มควบคุมตรงกลางวงล้อ
            const centerControls = `
                <div class="tarot-center-controls absolute z-20 text-center flex flex-col items-center justify-center w-[160px] md:w-[200px] pointer-events-auto bg-[#0a0512]/80 backdrop-blur-md p-4 rounded-full border border-purple-500/30 shadow-[0_0_20px_rgba(168,85,247,0.2)] aspect-square">
                    <p class="text-[11px] md:text-[13px] text-slate-200 mb-2 leading-relaxed" id="selection-status-inner">คลิกเลือกไพ่ ${isThree ? '3' : '1'} ใบ <br>แล้วคลิก 'ทำนาย'</p>
                    <div id="wheel-actions" class="flex justify-center gap-3 text-blue-400 mb-3 text-[13px] md:text-[15px] underline underline-offset-4 font-medium">
                        <button onclick="window.shuffleWheelAction()" class="hover:text-blue-300 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">สับไพ่</button>
                        <button onclick="window.cutWheelAction()" class="hover:text-blue-300 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">ตัดไพ่</button>
                    </div>
                    <button id="predict-btn" onclick="window.submitPrediction()" disabled class="px-6 py-1.5 bg-slate-600 text-white rounded font-medium disabled:opacity-50 transition-colors cursor-not-allowed text-xs md:text-sm shadow-md">ทำนาย</button>
                </div>
            `;

            container.innerHTML = centerControls + html;

            if (animateFromCenter) {
                container.offsetHeight; 
                const cards = container.querySelectorAll('.deck-card-circle');
                cards.forEach(card => {
                    card.style.transform = ''; 
                });
            }
        };

        window.shuffleWheelAction = function() {
            const container = document.getElementById('deck-container');
            if(!container) return;
            if (container.dataset.busy === 'true') return;
            container.dataset.busy = 'true';
            const cards = container.querySelectorAll('.deck-card-circle');
            
            const actionBtns = document.querySelectorAll('#wheel-actions button');
            actionBtns.forEach(b => b.disabled = true);

            cards.forEach(card => card.style.transform = 'rotate(0deg) translateY(0px) translateX(0px)');

            setTimeout(() => {
                cards.forEach((card, i) => {
                    const dir = i % 2 === 0 ? -1 : 1;
                    card.style.transform = `rotate(${dir * 10}deg) translateX(${dir * 50}px) translateY(-10px)`;
                });
            }, 350);

            setTimeout(() => {
                cards.forEach(card => card.style.transform = 'rotate(0deg) translateY(0px) translateX(0px)');
            }, 700);

            setTimeout(() => {
                availableDeck = shuffleArray(availableDeck);
                window.renderWheelSpread(true);
                actionBtns.forEach(b => b.disabled = false);
                container.dataset.busy = 'false';
            }, 1050);
        };

        window.cutWheelAction = function() {
            const container = document.getElementById('deck-container');
            if(!container) return;
            if (container.dataset.busy === 'true') return;
            container.dataset.busy = 'true';
            const cards = container.querySelectorAll('.deck-card-circle');
            
            const actionBtns = document.querySelectorAll('#wheel-actions button');
            actionBtns.forEach(b => b.disabled = true);

            const cutPoint = Math.floor(Math.random() * (availableDeck.length - 10)) + 5;

            cards.forEach(card => card.style.transform = 'rotate(0deg) translateY(0px) translateX(0px)');

            setTimeout(() => {
                cards.forEach((card, i) => {
                    if (i < cutPoint) card.style.transform = 'translateX(50px) translateY(-30px) rotate(5deg)';
                    else card.style.transform = 'translateX(-30px) translateY(10px) rotate(-5deg)';
                });
            }, 350);

            setTimeout(() => {
                cards.forEach(card => card.style.transform = 'rotate(0deg) translateY(0px) translateX(0px)');
            }, 700);

            setTimeout(() => {
                const topHalf = availableDeck.slice(0, cutPoint);
                const bottomHalf = availableDeck.slice(cutPoint);
                availableDeck = bottomHalf.concat(topHalf);
                window.renderWheelSpread(true);
                actionBtns.forEach(b => b.disabled = false);
                container.dataset.busy = 'false';
            }, 1050);
        };

        // ==========================================
        // ฟังก์ชันสำหรับพัด (Fan Spread - 22 ใบ)
        // ==========================================
        window.renderFanSpread = function(animateFromCenter = false) {
            const container = document.getElementById('deck-container');

            let html = '';

            for(let i=0; i<availableDeck.length; i++) {
                if(availableDeck[i]) validCards.push(i);
            }
            
            const total = validCards.length;
            const maxAngle = window.innerWidth < 768 ? 38 : 55;
            
            validCards.forEach((originalIndex, idx) => {
                const angle = -maxAngle + ((maxAngle * 2) / (total - 1 || 1)) * idx;
                const inlineTransform = animateFromCenter ? 'transform: rotate(0deg) translateY(0px) translateX(0px);' : '';
                
                html += `
                    <div class="deck-card-fan cursor-pointer rounded border border-purple-400/50 card-back shadow-md"

                         onmouseleave="window.restoreDeckCardLayer(this)"
                         onclick="window.selectFromDeck(this)">

            if (animateFromCenter) {
                container.offsetHeight; 
                const cards = container.querySelectorAll('.deck-card-fan');
                cards.forEach(card => {
                    card.style.transform = ''; 
                });
            }
        };

        // ==========================================
        // การคลิกปุ่ม "ทำนาย"
        // ==========================================
        window.submitPrediction = function() {
            const reqCards = userData.spreadType === 'wheel3' ? 3 : 1;
            if (selectedCardsData.length !== reqCards) return;
            
            chatState = 'PROCESSING';
            const msgBox = document.getElementById('predict-btn').closest('.bg-\\[\\#1a0f2e\\]\\/90');
            
            const deckContainer = msgBox.querySelector('#deck-container');
            if(deckContainer) {
                deckContainer.style.opacity = '0.3';
                deckContainer.style.pointerEvents = 'none';
            }
            
            const predictBtn = msgBox.querySelector('#predict-btn');
            if (predictBtn) {
                predictBtn.disabled = true;
                predictBtn.className = "px-6 py-1.5 md:px-8 md:py-2 bg-slate-600 text-white rounded font-medium disabled:opacity-50 transition-colors cursor-not-allowed text-xs md:text-sm shadow-md";
            }
            
            setTimeout(() => {
                generatePrediction(selectedCardsData);
            }, 1000);
        };

        // ==========================================
        // การเลือกไพ่จากวงล้อหรือพัด
        // ==========================================
        window.selectFromDeck = function(element) {
            if(chatState !== 'AWAITING_CARD_SELECTION') return;
            if (isSelectingCard || element?.dataset.selected === 'true') return;

            const isWheel = userData.spreadType.startsWith('wheel');
            const reqCards = userData.spreadType === 'wheel3' ? 3 : 1;
            
            if(selectedCardsData.length >= reqCards) return;

            const deckContainer = element.closest('#deck-container');
            if (deckContainer?.dataset.busy === 'true') return;

            const cardIndex = parseInt(element.getAttribute('data-index'));
            const selectedCard = availableDeck[cardIndex];
            if (!selectedCard) return;

            const isTouchSelection = window.matchMedia('(hover: none), (pointer: coarse)').matches;
            if (isTouchSelection && previewCardElement !== element) {
                if (previewCardElement) {
                    previewCardElement.classList.remove('is-preview');
                    window.restoreDeckCardLayer(previewCardElement);
                }
                previewCardElement = element;
                element.classList.add('is-preview');
                window.bringDeckCardToFront(element);

                const msgBox = element.closest('.bg-\\[\\#1a0f2e\\]\\/90');
                const statusId = isWheel ? '#selection-status-inner' : '#selection-status';
                const statusEl = msgBox?.querySelector(statusId);
                if (statusEl) statusEl.innerHTML = `แตะไพ่ใบเดิมอีกครั้ง<br>เพื่อเลือกใบนี้`;
                return;
            }

            isSelectingCard = true;
            element.dataset.selected = 'true';
            if (previewCardElement === element) previewCardElement = null;

            // ทำให้ไพ่ในกองหายไป
            element.classList.remove('is-preview');
            element.classList.add('is-picked');
            availableDeck[cardIndex] = null; 
            
            selectedCardsData.push(selectedCard);
            const slotIndex = selectedCardsData.length - 1;

            const msgBox = element.closest('.bg-\\[\\#1a0f2e\\]\\/90');
            const targetSlot = msgBox.querySelector(`#slot-${slotIndex}`);

            // อัปเดต UI ของ Slot โดยใช้ labels ที่ตรงกับโหมด
            const labels = getSlotLabels();
            let badgeText = 'ไพ่ที่เลือก';
            if (reqCards === 3) {
                badgeText = labels[slotIndex];
            }

            targetSlot.outerHTML = `
                <div class="tarot-card-container w-[60px] h-[90px] md:w-[80px] md:h-[120px] relative mx-auto">
                    <span class="text-[10px] absolute -top-5 left-1/2 -translate-x-1/2 whitespace-nowrap px-2 py-0.5 rounded-full text-purple-200 bg-purple-900/80 border border-purple-500/50 shadow-md z-10">${badgeText}</span>
                    <div class="tarot-card w-full h-full flipped">
                        <div class="card-face card-back"></div>
                        <div class="card-face card-front relative">
                            <img src="${selectedCard.imgUrl}" alt="${selectedCard.name}">
                        </div>
                    </div>
                </div>
            `;

            // อัปเดตข้อความและปุ่มคำสั่ง
            const actionsId = isWheel ? '#wheel-actions' : '#fan-actions';
            const statusId = isWheel ? '#selection-status-inner' : '#selection-status';

            if (selectedCardsData.length === reqCards) {
                const actions = msgBox.querySelector(actionsId);
                if(actions) actions.style.display = 'none';

                const statusEl = msgBox.querySelector(statusId);
                if(statusEl) statusEl.innerHTML = `<span class="text-green-400 font-bold tracking-wide text-[12px] md:text-[14px]">เลือกครบแล้ว<br>คลิก 'ทำนาย'</span>`;

                const predictBtn = msgBox.querySelector('#predict-btn');
                if (predictBtn) {
                    predictBtn.disabled = false;
                    predictBtn.className = "px-6 py-1.5 md:px-8 md:py-2 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white rounded font-bold shadow-md transition-colors cursor-pointer text-xs md:text-sm";
                }
            } else {
                if (reqCards === 3) {
                    const statusEl = msgBox.querySelector(statusId);
                    if (statusEl) statusEl.innerHTML = `คลิกเลือกไพ่ใบที่ ${selectedCardsData.length + 1}<br>จาก 3 ใบ`;
                }
            }

            lucide.createIcons();
            setTimeout(scrollToBottom, 50);
            isSelectingCard = false;
        };

        // 5. ส่งให้ AI ทำนาย
        async function generatePrediction(cards) {
            showTyping(true);
            
            // ล็อกปุ่มและช่องแชทเอาไว้ก่อนระหว่างรอรับคำถามใหม่
            userInput.disabled = true;
            userInput.placeholder = "รอรับคำทำนายจากแม่หมอ...";

            try {
                if (!currentTarotSessionId) {
                    try {
                        await createTarotSession(userData.question || 'ไม่มี');
                    } catch (err) {
                        console.error('Unable to create tarot session:', err);
                    }
                }

                await saveTarotMessage('user', userData.question || 'ไม่มี');
                const data = await requestTarotReading(userData.question || 'ไม่มี', cards, 'TAROT_READING');
                const reply = data.prediction || data.result || data.message;

                showTyping(false);
                appendTarotReadingMessage(cards, reply);
                await saveTarotMessage('assistant', `<b>หน้าไพ่ที่คุณเปิดได้:</b>${buildCardsSummaryHTML(cards)}<b>คำทำนายจากแม่หมอ:</b><br>${reply}`);
                await saveTarotReading(cards, reply);
                await updateTarotSessionTitle(cards);

                chatState = 'READING_COMPLETE';
                userInput.disabled = true;
                sendBtn.disabled = true;
                userInput.placeholder = "โปรดเลือกรูปแบบคำถามด้านบน...";
                appendFollowUpOptions();
            } catch (err) {
                showTyping(false);
                chatState = 'AWAITING_QUESTION';
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.placeholder = "ลองถามใหม่อีกครั้งได้เลยค่ะ...";
                userInput.focus();
                appendAIMessage(getReadingErrorMessage(err, "ขออภัยค่ะ ระบบอ่านไพ่กำลังมีปัญหา กรุณาลองใหม่อีกครั้ง"));
                console.error(err);
            }
        }

        // ==========================================
        // ฟังก์ชันเมื่อกดปุ่ม "ถามเพิ่มจากไพ่เดิม"
        // ==========================================
        window.askFollowUpQuestion = function(btnElement) {
            if(chatState !== 'READING_COMPLETE') return;

            // ปรับ UI ของกลุ่มปุ่มให้รู้ว่ากดไปแล้ว
            const container = btnElement.closest('.flex');
            const btns = container.querySelectorAll('button');
            btns.forEach(b => {
                b.disabled = true;
                b.classList.add('opacity-50', 'cursor-not-allowed');
                b.classList.remove('hover:scale-105');
            });
            btnElement.innerText = "เลือกถามเพิ่มแล้ว";

            appendUserMessage("ขอถามเพิ่มเติมจากไพ่ชุดนี้ค่ะ/ครับ");

            showTyping(true);
            setTimeout(() => {
                showTyping(false);
                
                chatState = 'FOLLOW_UP_QUESTION';
                
                const userInputEl = document.getElementById('user-input');
                const sendBtnEl = document.getElementById('send-btn');
                
                userInputEl.disabled = false;
                sendBtnEl.disabled = false;
                userInputEl.placeholder = "พิมพ์คำถามเพิ่มเติมเกี่ยวกับไพ่ชุดนี้ได้เลยค่ะ...";
                userInputEl.focus();
                
                appendAIMessage("ได้เลยค่ะ มีเรื่องไหนจากหน้าไพ่ชุดนี้ที่คุณอยากให้แม่หมอช่วยขยายความ หรือมีคำถามอะไรเพิ่มเติม พิมพ์มาได้เลยนะคะ 🔮");
            }, 1000);
        };

        // ==========================================
        // ฟังก์ชันเมื่อกดปุ่ม "ตั้งคำถามและเปิดไพ่ใหม่"
        // ==========================================
        window.prepareNewQuestion = function(btnElement) {
            // ป้องกันการกดซ้ำซ้อน
            if(chatState !== 'READING_COMPLETE') return;

            // ปรับ UI ของกลุ่มปุ่มให้รู้ว่ากดไปแล้ว
            const container = btnElement.closest('.flex');
            const btns = container.querySelectorAll('button');
            btns.forEach(b => {
                b.disabled = true;
                b.classList.add('opacity-50', 'cursor-not-allowed');
                b.classList.remove('hover:scale-105');
            });
            btnElement.innerText = "เลือกเปิดไพ่ใหม่แล้ว";

            appendUserMessage("ต้องการตั้งคำถามและเปิดไพ่ใหม่ค่ะ/ครับ");
            currentTarotSessionId = null;

            showTyping(true);
            setTimeout(() => {
                showTyping(false);
                
                // ตรวจสอบว่าถ้าอยู่ในหมวด 3 สถานการณ์ ให้ถามรูปแบบย่อยอีกครั้ง
                if (userData.categoryKey === 'three_situations') {
                    chatState = 'AWAITING_SUB_CATEGORY';
                    appendAIMessage('', `<div class="text-sm leading-snug">สำหรับการอ่านไพ่ 3 สถานการณ์ในรอบนี้ อยากเน้นแบบไหนเป็นพิเศษคะ?</div>${buildThreeSituationOptions()}`, { parseMarkdown: false });
                } else {
                    // เปลี่ยน State ให้กลับไปรอคำถามใหม่ (สำหรับโหมดอื่นๆ)
                    chatState = 'AWAITING_QUESTION';
                    
                    // เปิดให้ช่องแชทกลับมาพิมพ์ได้อีกครั้ง
                    const userInputEl = document.getElementById('user-input');
                    const sendBtnEl = document.getElementById('send-btn');
                    
                    userInputEl.disabled = false;
                    sendBtnEl.disabled = false;
                    userInputEl.placeholder = "พิมพ์คำถามใหม่ของคุณได้เลยค่ะ...";
                    userInputEl.focus();
                    
                    appendAIMessage("ยินดีค่ะ พิมพ์คำถามใหม่ที่คุณอยากให้แม่หมอและไพ่ช่วยชี้แนะมาได้เลยนะคะ 🔮");
                }
            }, 1000);
        };

        // ==========================================
        // Profile Popup
        // ==========================================
        async function loadProfileForPopup() {
            const checkClient = setInterval(async () => {
                if (typeof supabaseClient !== 'undefined' && supabaseClient) {
                    clearInterval(checkClient);
                    try {
                        const { data: { session } } = await supabaseClient.auth.getSession();
                        if (session && session.user) {
                            currentUser = session.user;
                            const userEmail = session.user.email;
                            if (userEmail) {
                                document.getElementById('popup-email').textContent = userEmail;
                                const domain = userEmail.split('@')[1];
                                if (domain) document.getElementById('popup-managed').textContent = 'Managed by ' + domain;
                            }
                            const { data: profile } = await supabaseClient.from('profiles').select('full_name,nickname').eq('id', session.user.id).single();
                            currentProfile = profile || currentProfile;
                            const displayName = profile?.full_name || profile?.nickname || userEmail?.split('@')[0] || 'USER';
                            document.getElementById('popup-greeting').textContent = 'Hi, ' + displayName.toUpperCase() + '!';
                            const firstLetter = displayName.charAt(0).toUpperCase();
                            document.getElementById('popup-avatar-letter').textContent = firstLetter;
                            document.getElementById('avatar-btn').innerHTML = `<span class="text-[rgb(var(--c-accent))] font-bold text-lg">${firstLetter}</span>`;
                        }
                    } catch (err) { console.error(err); }
                }
            }, 100);
        }
        loadProfileForPopup();

        document.addEventListener('DOMContentLoaded', () => {
            const avatarBtn = document.getElementById('avatar-btn');
            const accountPopup = document.getElementById('account-popup');
            const closePopup = document.getElementById('close-popup');

            if (avatarBtn && accountPopup) {
                avatarBtn.addEventListener('click', () => {
                    accountPopup.style.display = accountPopup.style.display === 'none' ? 'block' : 'none';
                });
                closePopup?.addEventListener('click', () => { accountPopup.style.display = 'none'; });
                document.addEventListener('click', (e) => {
                    if (!avatarBtn.contains(e.target) && !accountPopup.contains(e.target)) {
                        accountPopup.style.display = 'none';
                    }
                });
            }
        });
    </script>
</body>
</html>
